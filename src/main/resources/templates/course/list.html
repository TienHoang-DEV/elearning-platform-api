<!DOCTYPE html>
<html lang="vi">

<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo-background.png}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết Quả Tìm Kiếm "Guitar" - Learning Hub</title>
    <meta name="description"
        content="Khám phá các khóa học guitar chất lượng cao phù hợp với trình độ của bạn tại Learning Hub.">

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Central Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <!-- Courses Search Page Custom Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/course.css}">
    <!-- Clean Interface Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/list.css}">

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @media (min-width: 992px) {
            .category-accordion .accordion-item:hover .accordion-button {
                background-color: var(--bs-accordion-active-bg);
                color: var(--bs-accordion-active-color);
            }
            .category-accordion .accordion-item:hover .accordion-button::after {
                background-image: var(--bs-accordion-btn-active-icon);
                transform: var(--bs-accordion-btn-icon-transform);
            }
        }
        .no-caret::after {
            display: none !important;
        }
    </style>
</head>

<body class="bg-light bg-opacity-25">

    <!-- Header Navigation -->
<header th:replace="fragments/header :: header"></header>

    <!-- Main Content Layout -->
    <main class="py-5">
        <div class="container py-3">

            <form id="filterForm" action="/courses" method="get">
                <input type="hidden" name="search" th:value="${search}">
                <input type="hidden" name="categoryId" id="categoryIdInput" th:value="${categoryId}">
                <input type="hidden" name="page" id="pageInput" th:value="${currentPage}">
                <div class="row g-4">

                    <!-- Left Sidebar Filters -->
                    <aside class="col-lg-3 col-md-4 col-12">
                        <div
                            class="card border border-light-subtle rounded-3 p-4 bg-white shadow-sm mb-4 sidebar-filters">

                            <!-- Filter Group 1: Categories -->
                            <div class="filter-group mb-4">
                                <h4 class="filter-title fw-bold fs-7 mb-3 d-flex align-items-center gap-2">
                                    <i data-lucide="folder" class="filter-icon"></i>
                                    Danh mục
                                </h4>
                                <div class="accordion category-accordion" id="categoryAccordion">
                                    <div class="accordion-item border-0 mb-1">
                                        <h2 class="accordion-header">
                                            <button
                                                class="accordion-button collapsed no-caret bg-transparent shadow-none border-0"
                                                th:classappend="${categoryId == null} ? 'active-category text-primary fw-bold' : 'text-dark'"
                                                type="button"
                                                th:onclick="'selectCategory(null); return false;'">
                                                Tất cả khóa học
                                            </button>
                                        </h2>
                                    </div>
                                    <div class="accordion-item border-0 mb-1" th:each="parentCat : ${parentCategories}">
                                        <h2 class="accordion-header" th:id="'heading-' + ${parentCat.id}">
                                            <button
                                                class="accordion-button collapsed bg-transparent shadow-none border-0"
                                                th:classappend="${categoryId == parentCat.id} ? 'active-category text-primary fw-bold' : 'text-dark'"
                                                type="button" data-bs-toggle="collapse"
                                                th:data-bs-target="'#collapse-' + ${parentCat.id}" aria-expanded="false"
                                                th:aria-controls="'collapse-' + ${parentCat.id}"
                                                th:text="${parentCat.name}"
                                                th:onclick="'selectCategory(' + ${parentCat.id} + '); return false;'">
                                                Lập trình Front-End
                                            </button>
                                        </h2>
                                        <div th:id="'collapse-' + ${parentCat.id}" class="accordion-collapse collapse"
                                            th:aria-labelledby="'heading-' + ${parentCat.id}"
                                            data-bs-parent="#categoryAccordion">
                                            <div class="accordion-body p-0 ps-3 pt-2 pb-2">
                                                <ul class="list-unstyled d-flex flex-column gap-2 m-0 fs-7">
                                                    <li th:each="childCat : ${parentCat.children}">
                                                        <a href="#"
                                                            class="filter-category-link text-decoration-none d-flex justify-content-between align-items-center"
                                                            th:classappend="${categoryId == childCat.id} ? 'active-category fw-bold text-primary' : 'text-muted'"
                                                            th:onclick="'selectCategory(' + ${childCat.id} + '); return false;'">
                                                            <span th:text="${childCat.name}">HTML</span>
                                                            <span class="text-muted fs-8"
                                                                th:text="'(' + ${childCat.courseCount} + ')'">(0)</span>
                                                        </a>
                                                    </li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <hr class="my-3 text-muted opacity-25">

                            <!-- Filter Group 2: Ratings -->
                            <div class="filter-group mb-4">
                                <h4 class="filter-title fw-bold fs-7 mb-3 d-flex align-items-center gap-2">
                                    <i data-lucide="star" class="filter-icon"></i>
                                    Đánh giá
                                </h4>
                                <div class="d-flex flex-column gap-2">
                                    <!-- Từ 4.5 sao trở lên -->
                                    <label class="d-flex align-items-center gap-2 fs-7 cursor-pointer text-muted-dark">
                                        <input type="checkbox" name="ratings"
                                            class="form-check-input border-secondary-subtle filter-rating-checkbox"
                                            value="4.5"
                                            th:checked="${selectedRatings != null && selectedRatings.contains(4.5)}"
                                            onchange="submitFormResetPage()">
                                        <span class="d-flex align-items-center gap-1">
                                            <i data-lucide="star" class="star-icon star-filled"></i>
                                            <i data-lucide="star" class="star-icon star-filled"></i>
                                            <i data-lucide="star" class="star-icon star-filled"></i>
                                            <i data-lucide="star" class="star-icon star-filled"></i>
                                            <i data-lucide="star-half" class="star-icon star-filled"></i>
                                            <span class="ms-1 text-muted fs-8">Từ 4,5 sao trở lên</span>
                                        </span>
                                    </label>

                                    <!-- Từ 4.0 sao trở lên -->
                                    <label class="d-flex align-items-center gap-2 fs-7 cursor-pointer text-muted-dark">
                                        <input type="checkbox" name="ratings"
                                            class="form-check-input border-secondary-subtle filter-rating-checkbox"
                                            value="4.0"
                                            th:checked="${selectedRatings != null && selectedRatings.contains(4.0)}"
                                            onchange="submitFormResetPage()">
                                        <span class="d-flex align-items-center gap-1">
                                            <i data-lucide="star" class="star-icon star-filled"></i>
                                            <i data-lucide="star" class="star-icon star-filled"></i>
                                            <i data-lucide="star" class="star-icon star-filled"></i>
                                            <i data-lucide="star" class="star-icon star-filled"></i>
                                            <i data-lucide="star" class="star-icon star-empty"></i>
                                            <span class="ms-1 text-muted fs-8">Từ 4 sao trở lên</span>
                                        </span>
                                    </label>

                                    <!-- Từ 3.5 sao trở lên -->
                                    <label class="d-flex align-items-center gap-2 fs-7 cursor-pointer text-muted-dark">
                                        <input type="checkbox" name="ratings"
                                            class="form-check-input border-secondary-subtle filter-rating-checkbox"
                                            value="3.5"
                                            th:checked="${selectedRatings != null && selectedRatings.contains(3.5)}"
                                            onchange="submitFormResetPage()">
                                        <span class="d-flex align-items-center gap-1">
                                            <i data-lucide="star" class="star-icon star-filled"></i>
                                            <i data-lucide="star" class="star-icon star-filled"></i>
                                            <i data-lucide="star" class="star-icon star-filled"></i>
                                            <i data-lucide="star-half" class="star-icon star-filled"></i>
                                            <i data-lucide="star" class="star-icon star-empty"></i>
                                            <span class="ms-1 text-muted fs-8">Từ 3,5 sao trở lên</span>
                                        </span>
                                    </label>

                                    <!-- Từ 3.0 sao trở lên -->
                                    <label class="d-flex align-items-center gap-2 fs-7 cursor-pointer text-muted-dark">
                                        <input type="checkbox" name="ratings"
                                            class="form-check-input border-secondary-subtle filter-rating-checkbox"
                                            value="3.0"
                                            th:checked="${selectedRatings != null && selectedRatings.contains(3.0)}"
                                            onchange="submitFormResetPage()">
                                        <span class="d-flex align-items-center gap-1">
                                            <i data-lucide="star" class="star-icon star-filled"></i>
                                            <i data-lucide="star" class="star-icon star-filled"></i>
                                            <i data-lucide="star" class="star-icon star-filled"></i>
                                            <i data-lucide="star" class="star-icon star-empty"></i>
                                            <i data-lucide="star" class="star-icon star-empty"></i>
                                            <span class="ms-1 text-muted fs-8">Từ 3 sao trở lên</span>
                                        </span>
                                    </label>
                                </div>
                            </div>

                            <hr class="my-3 text-muted opacity-25">

                            <!-- Filter Group 3: Price -->
                            <div class="filter-group">
                                <h4 class="filter-title fw-bold fs-7 mb-3 d-flex align-items-center gap-2">
                                    <i data-lucide="coins" class="filter-icon"></i>
                                    Giá tiền
                                </h4>
                                <div class="d-flex flex-column gap-2 fs-7 text-muted-dark">
                                    <label class="d-flex align-items-center gap-2 cursor-pointer">
                                        <input type="checkbox" name="prices"
                                            class="form-check-input border-secondary-subtle filter-price-checkbox"
                                            value="0-0"
                                            th:checked="${selectedPrices != null && selectedPrices.contains('0-0')}"
                                            onchange="submitFormResetPage()">
                                        <span>Miễn phí (0 VNĐ)</span>
                                    </label>
                                    <label class="d-flex align-items-center gap-2 cursor-pointer">
                                        <input type="checkbox" name="prices"
                                            class="form-check-input border-secondary-subtle filter-price-checkbox"
                                            value="200000-500000"
                                            th:checked="${selectedPrices != null && selectedPrices.contains('200000-500000')}"
                                            onchange="submitFormResetPage()">
                                        <span>200.000 - 500.000 VNĐ</span>
                                    </label>
                                    <label class="d-flex align-items-center gap-2 cursor-pointer">
                                        <input type="checkbox" name="prices"
                                            class="form-check-input border-secondary-subtle filter-price-checkbox"
                                            value="500000-700000"
                                            th:checked="${selectedPrices != null && selectedPrices.contains('500000-700000')}"
                                            onchange="submitFormResetPage()">
                                        <span>500.000 - 700.000 VNĐ</span>
                                    </label>
                                    <label class="d-flex align-items-center gap-2 cursor-pointer">
                                        <input type="checkbox" name="prices"
                                            class="form-check-input border-secondary-subtle filter-price-checkbox"
                                            value="700000-1000000"
                                            th:checked="${selectedPrices != null && selectedPrices.contains('700000-1000000')}"
                                            onchange="submitFormResetPage()">
                                        <span>700.000 - 1.000.000 VNĐ</span>
                                    </label>
                                    <label class="d-flex align-items-center gap-2 cursor-pointer">
                                        <input type="checkbox" name="prices"
                                            class="form-check-input border-secondary-subtle filter-price-checkbox"
                                            value="1000000-99999999"
                                            th:checked="${selectedPrices != null && selectedPrices.contains('1000000-99999999')}"
                                            onchange="submitFormResetPage()">
                                        <span>Trên 1.000.000 VNĐ</span>
                                    </label>
                                </div>
                            </div>

                        </div>
                    </aside>

                    <!-- Right Side Course List -->
                    <section class="col-lg-9 col-md-8 col-12">

                        <!-- Search Info & Sorting -->
                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                            <div>
                                <h2 class="search-result-title fw-extrabold font-heading fs-4 m-0 d-inline-block"
                                    th:text="${search != null && !search.isEmpty()} ? 'Kết quả cho &quot;' + ${search} + '&quot;' : (${selectedCategoryName != null} ? 'Khóa học ' + ${selectedCategoryName} : 'Tất cả khóa học')">
                                    Kết quả cho "Guitar"
                                </h2>
                                <span class="text-muted fs-7 ms-2"
                                    th:text="${totalCourses != null} ? ${totalCourses} + ' khóa học' : ${courses.size()} + ' khóa học'">128
                                    khóa học</span>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <select name="sort" id="sort-select"
                                    class="form-select border-light-subtle rounded-3 py-2 px-3 fs-7 text-muted fw-semibold course-sort-select"
                                    onchange="submitFormResetPage()">
                                    <option value="newest" th:selected="${sort == 'newest'}">Mới nhất</option>
                                    <option value="rating" th:selected="${sort == 'rating'}">Đánh giá tốt nhất</option>
                                    <option value="price-asc" th:selected="${sort == 'price-asc'}">Giá tăng dần</option>
                                    <option value="price-desc" th:selected="${sort == 'price-desc'}">Giá giảm dần
                                    </option>
                                </select>
                            </div>
                        </div>

                        <!-- Courses Horizontal List -->
                        <div class="d-flex flex-column gap-4 mb-5">

                            <!-- Course Row Loop -->
                            <div class="course-list-item d-flex gap-4 p-4 border border-light-subtle rounded-3 bg-white shadow-sm flex-md-row flex-column align-items-start"
                                th:each="course : ${courses}" th:data-course-id="${course.id}"
                                th:data-rating="${course.averageRating}" th:data-price="${course.price}"
                                th:data-category-id="${course.category != null ? course.category.id : ''}">
                                <!-- Left: Thumbnail -->
                                <a th:href="@{/course/detail(id=${course.id})}"
                                    class="course-thumbnail-link">
                                    <img th:src="${course.thumbnailPath}" th:alt="${course.title}"
                                        class="w-100 h-100 object-fit-cover"
                                        onerror="this.onerror=null; this.src='/images/course_thumbnail.png';">
                                    <span
                                        class="position-absolute bottom-0 end-0 bg-dark bg-opacity-75 text-white fs-8 px-2.5 py-1 rounded-pill m-3 fw-medium"
                                        th:text="${course.getDurationMinutes()} + ' phút'">31 phút</span>
                                </a>

                                <!-- Right: khóa học -->
                                <div class="course-info-wrapper">
                                    <div>
                                        <a th:href="@{/course/detail(id=${course.id})}"
                                            class="text-decoration-none text-dark">
                                            <h3 class="course-item-title fw-bold fs-6 mb-2 font-heading"
                                                th:text="${course.title}">
                                                Guitar đệm hát 30 ngày cùng Hiển Râu
                                            </h3>
                                        </a>

                                        <div class="rating-stars mb-2 d-flex align-items-center gap-1">
                                            <span class="fw-bold text-warning fs-7"
                                                th:text="${course.averageRating}">4.5</span>
                                            <span th:each="i : ${#numbers.sequence(1, 5)}" class="d-inline-flex">
                                                <!-- Full Star -->
                                                <i th:if="${i <= course.averageRating}" data-lucide="star"
                                                    class="star-icon star-filled"></i>
                                                <!-- Half Star -->
                                                <i th:if="${i > course.averageRating && (i - 1) < course.averageRating}"
                                                    data-lucide="star-half" class="star-icon star-filled"></i>
                                                <!-- Empty Star -->
                                                <i th:if="${(i - 1) >= course.averageRating}" data-lucide="star"
                                                    class="star-icon star-empty"></i>
                                            </span>
                                            <span class="text-muted fs-8 ms-1"
                                                th:text="'(' + ${course.ratingCount} + ' đánh giá)'">(2 đánh giá)</span>
                                        </div>

                                        <a th:href="@{/instructor-profile/{id}(id=${course.instructor.id})}"
                                            class="instructor-name fw-bold fs-8 text-primary d-block mb-3 text-decoration-none text-primary"
                                            th:text="${course.instructor.lastName + ' ' + course.instructor.firstName}">NGUYỄN
                                            CÔNG THÁI SƠN</a>
                                    </div>

                                    <div
                                        class="d-flex align-items-center justify-content-between flex-wrap gap-3 mt-auto">
                                        <!-- Meta Attributes -->
                                        <div class="d-flex align-items-center gap-3 text-muted fs-8">
                                            <span class="d-flex align-items-center gap-1"><i data-lucide="clock"
                                                    class="course-meta-icon"></i> <span th:text="${course.getDurationMinutes()} + ' phút'">31 phút</span></span>
                                            <span class="d-flex align-items-center gap-1"><i data-lucide="zap"
                                                    class="course-meta-icon"></i> <span th:text="${course.level}">Cơ
                                                     bản</span></span>
                                            <span class="d-flex align-items-center gap-1"><i data-lucide="eye"
                                                    class="course-meta-icon"></i> <span
                                                    th:text="${course.enrollmentsCount} + ' lượt mua'">0 lượt
                                                    mua</span></span>
                                        </div>

                                        <!-- Price & Cart -->
                                        <div class="d-flex align-items-center gap-3 ms-auto align-self-end">
                                            <div class="text-end">
                                                <span class="price-current fw-extrabold fs-5 d-block"
                                                    th:text="${#numbers.formatDecimal(course.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">209,300
                                                    VNĐ</span>
                                            </div>

                                            <!-- Nếu đã mua khóa học -->
                                            <a th:if="${enrolledCourseIds != null && enrolledCourseIds.contains(course.id)}"
                                                th:href="@{/course/detail(id=${course.id})}"
                                                class="btn btn-outline-success px-3 py-2 fw-bold fs-8 d-flex align-items-center gap-2 rounded-3 text-decoration-none">
                                                <i data-lucide="check-circle" style="width:16px;"></i> Đã mua
                                            </a>

                                            <!-- Nếu chưa mua -->
                                            <button
                                                th:unless="${enrolledCourseIds != null && enrolledCourseIds.contains(course.id)}"
                                                class="btn btn-add-to-cart px-3 py-2 fw-bold fs-8 d-flex align-items-center gap-2 rounded-3"
                                                type="button" th:onclick="'addToCart(this, ' + ${course.id} + ')'">
                                                <i data-lucide="shopping-cart" style="width:16px;"></i> Thêm vào giỏ
                                                hàng
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>

                        <!-- Centered Pagination (Numbers only matching image) -->
                        <div class="d-flex justify-content-center" th:if="${totalPages > 1}">
                            <nav aria-label="Page navigation">
                                <ul class="pagination gap-2 border-0 m-0">
                                    <!-- Nút trang trước -->
                                    <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                                        <a class="page-link rounded-circle d-flex align-items-center justify-content-center p-0 fw-semibold page-num-btn text-dark"
                                            href="#"
                                            th:onclick="'changePage(' + ${currentPage - 1} + '); return false;'">
                                            &lt;
                                        </a>
                                    </li>

                                    <!-- Số trang -->
                                    <th:block th:each="pageNum : ${#numbers.sequence(1, totalPages)}">
                                        <li class="page-item" th:classappend="${pageNum == currentPage} ? 'active'"
                                            th:if="${totalPages <= 7 || pageNum == 1 || pageNum == totalPages || (pageNum >= currentPage - 1 && pageNum <= currentPage + 1)}">
                                            <a class="page-link rounded-circle d-flex align-items-center justify-content-center p-0 page-num-btn"
                                                href="#"
                                                th:classappend="${pageNum == currentPage} ? 'text-white fw-bold' : 'text-dark fw-semibold'"
                                                th:text="${pageNum}"
                                                th:onclick="'changePage(' + ${pageNum} + '); return false;'">
                                                1
                                            </a>
                                        </li>

                                        <!-- Dấu ... ở đầu -->
                                        <li class="page-item disabled"
                                            th:if="${totalPages > 7 && pageNum == 2 && currentPage > 3}">
                                            <span
                                                class="page-link rounded-circle d-flex align-items-center justify-content-center p-0 border-0 bg-transparent text-muted fw-semibold"
                                                style="width: 38px; height: 38px;">...</span>
                                        </li>

                                        <!-- Dấu ... ở cuối -->
                                        <li class="page-item disabled"
                                            th:if="${totalPages > 7 && pageNum == totalPages - 1 && currentPage < totalPages - 2}">
                                            <span
                                                class="page-link rounded-circle d-flex align-items-center justify-content-center p-0 border-0 bg-transparent text-muted fw-semibold"
                                                style="width: 38px; height: 38px;">...</span>
                                        </li>
                                    </th:block>

                                    <!-- Nút trang tiếp theo -->
                                    <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                                        <a class="page-link rounded-circle d-flex align-items-center justify-content-center p-0 fw-semibold page-num-btn text-dark"
                                            href="#"
                                            th:onclick="'changePage(' + ${currentPage + 1} + '); return false;'">
                                            &gt;
                                        </a>
                                    </li>
                                </ul>
                            </nav>
                        </div>

                    </section>

                </div>
            </form>

        </div>
    </main>

    <footer th:replace="fragments/footer :: footer"></footer>

    <!-- Bootstrap 5 Bundle JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <!-- Custom Inline JavaScript Helpers -->
    <script>
        // Hàm xử lý khi người dùng chọn lọc theo Danh mục (Category)
        function selectCategory(catId) {
            const input = document.getElementById('categoryIdInput');
            // Nếu click lại đúng danh mục đang được lọc hiện tại -> Bỏ lọc (set rỗng)
            if (input.value == catId) {
                input.value = '';
            } else {
                // Nếu click danh mục mới -> Gán ID danh mục mới để gửi lên server lọc
                input.value = catId;
            }
            document.getElementById('pageInput').value = 1; // Reset trang về 1 khi lọc mới
            document.getElementById('filterForm').submit(); // Submit form gửi GET request về Controller
        }

        // Hàm xử lý khi người dùng thay đổi số trang phân trang
        function changePage(pageNum) {
            document.getElementById('pageInput').value = pageNum; // Gán số trang mới chọn
            document.getElementById('filterForm').submit(); // Gửi request tải lại trang với trang mới
        }

        // Hàm xử lý reset trang về 1 và submit form (dùng cho Ratings, Prices, Sort)
        function submitFormResetPage() {
            document.getElementById('pageInput').value = 1; // Đưa trang về 1 khi đổi bộ lọc mới
            document.getElementById('filterForm').submit(); // Submit form
        }

        // Hàm gọi API thêm khóa học vào giỏ hàng qua Fetch API (AJAX)
        async function addToCart(btn, courseId) {
            btn.disabled = true; // Khóa nút bấm để chống spam click nhiều lần

            try {
                // Gửi yêu cầu HTTP POST bất đồng bộ tới API /api/cart/add
                const response = await fetch('/api/cart/add?courseId=' + courseId, { 
                    method: 'POST',
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });
                
                // Trình duyệt tự động follow redirect 302 về trang login và trả về 200 OK của trang HTML
                if (response.redirected || response.url.includes('/login') || response.url.includes('/login_no')) {
                    showToast('Bạn chưa đăng nhập. Vui lòng đăng nhập để thực hiện chức năng này.', 'warning');
                    return;
                }

                if (!response.ok) {
                    if (response.status === 401) {
                        showToast('Bạn chưa đăng nhập. Vui lòng đăng nhập để thực hiện chức năng này.', 'warning');
                        return;
                    }
                    let errMsg = 'Có lỗi xảy ra khi thêm vào giỏ hàng.';
                    try {
                        const errData = await response.json();
                        errMsg = errData.message || errData.error || errMsg;
                    } catch (e) {}
                    throw new Error(errMsg);
                }

                const contentType = response.headers.get("content-type");
                if (!contentType || contentType.indexOf("application/json") === -1) {
                    throw new Error("Lỗi máy chủ: Không trả về JSON.");
                }

                const data = await response.json();
                
                if (data.success) { // Nếu thêm thành công
                    const badge = document.getElementById('cart-badge-count');
                    if (badge) {
                        badge.textContent = data.cartSize; // Cập nhật số lượng giỏ hàng trên thanh Header
                    }
                    showToast(data.message, data.newlyAdded ? 'success' : 'warning');
                } else {
                    showToast(data.message || 'Không thể thêm vào giỏ hàng.', 'warning');
                }
            } catch (error) {
                console.error('Lỗi khi thêm vào giỏ hàng:', error);
                showToast(error.message, 'warning');
            } finally {
                btn.disabled = false; // Mở khóa lại nút bấm
            }
        }

        // Hàm hiển thị Toast thông báo
        function showToast(message, type = 'success') {
            const toastEl = document.getElementById('cartToast');
            const messageEl = document.getElementById('toast-message-text');
            if (toastEl && messageEl) {
                messageEl.textContent = message; // Gán nội dung thông báo
                const titleEl = toastEl.querySelector('.toast-title');

                if (type === 'success') {
                    toastEl.classList.remove('toast-warning');
                    toastEl.classList.add('toast-success');
                    if (titleEl) titleEl.textContent = "Thành công!";
                } else {
                    toastEl.classList.remove('toast-success');
                    toastEl.classList.add('toast-warning');
                    if (titleEl) titleEl.textContent = "Thông báo!";
                }

                const toast = new bootstrap.Toast(toastEl);
                toast.show();
            }
        }
    </script>
 
    <!-- Bootstrap Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-4" style="z-index: 1100;">
        <div class="toast align-items-center border-0 rounded-3 shadow-lg toast-success" id="cartToast"
            role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-3 p-3">
                    <i data-lucide="check-circle" class="toast-icon-success" style="width: 24px; height: 24px;"></i>
                    <i data-lucide="alert-circle" class="toast-icon-warning" style="width: 24px; height: 24px;"></i>
                    <div class="toast-content flex-grow-1">
                        <p class="toast-title fw-bold m-0 fs-7">Thành công!</p>
                        <p class="toast-message m-0 fs-8" id="toast-message-text">Thông báo</p>
                    </div>
                </div>
                <button type="button" class="btn-close me-3 m-auto shadow-none" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (window.innerWidth >= 992) {
                const accordionItems = document.querySelectorAll('.category-accordion .accordion-item');
                accordionItems.forEach(item => {
                    const collapseEl = item.querySelector('.accordion-collapse');
                    if (collapseEl) {
                        let timeout;
                        item.addEventListener('mouseenter', () => {
                            clearTimeout(timeout);
                            const bsCollapse = bootstrap.Collapse.getOrCreateInstance(collapseEl, { toggle: false });
                            bsCollapse.show();
                        });
                        item.addEventListener('mouseleave', () => {
                            timeout = setTimeout(() => {
                                const bsCollapse = bootstrap.Collapse.getOrCreateInstance(collapseEl, { toggle: false });
                                bsCollapse.hide();
                            }, 100);
                        });
                    }
                });
            }
        });
    </script>
    <script>lucide.createIcons();</script>
