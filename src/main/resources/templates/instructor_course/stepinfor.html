<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<div th:fragment="content">
  <form th:action="@{/instructorcourse/save}"
        method="POST" enctype="multipart/form-data" id="courseInfoForm" th:object="${courseRequest}">
      <input type="hidden" th:field="*{id}">
    <div class="card">
      <div class="card-title">Giới Thiệu Khóa Học</div>

      <!-- Tiêu đề -->
      <div class="form-group" style="margin-bottom:16px;">
        <label>Tiêu Đề Khóa Học <span class="required">*</span></label>
        <input type="text" name="title" class="form-control" id="courseTitleInput"
               th:field="*{title}"
               th:classappend="${#fields.hasErrors('title')} ? ' is-invalid' : ''"
               placeholder="Tiêu đề từ 8 đến 60 ký tự" required/>
        <div class="form-hint">Tối đa 60 ký tự</div>
        <p class="text-danger"
           th:if="${#fields.hasErrors('title')}"
           th:errors="*{title}">
        </p>
      </div>

      <div class="form-group" style="margin-bottom:16px;">
        <label>Mô Tả Khóa Học</label>
        <div class="rich-toolbar">
          <button data-cmd="bold" type="button"><b>B</b></button>
          <button data-cmd="italic" type="button"><i>I</i></button>
          <button data-cmd="underline" type="button"><u>U</u></button>
          <button data-cmd="insertUnorderedList" type="button">• List</button>
          <button data-cmd="insertOrderedList" type="button">1. List</button>
          <button data-cmd="formatBlock" data-val="h3" type="button">H3</button>
          <button data-cmd="removeFormat" type="button">✕</button>
        </div>
        <div class="rich-editor" id="courseDescEditor" contenteditable="true"
             th:utext="*{description}"
             th:classappend="${#fields.hasErrors('description')} ? ' is-invalid' : ''"
             data-placeholder="Nhập mô tả đầy đủ cho khóa học..."></div>
        <input type="hidden" th:field="*{description}" id="descHidden" required/>
        <p
          class="text-danger"
          th:if="${#fields.hasErrors('description')}"
          th:errors="*{description}"></p>
      </div>

      <!-- Level & Category -->
      <div class="form-grid" style="margin-top:16px;">
        <div class="form-group">
          <label>Trình Độ Khóa Học</label>
          <select th:field="*{level}" class="form-control"
                  th:classappend="${#fields.hasErrors('level')} ? ' is-invalid' : ''">
            <option value="">Chọn Trình Độ</option>
            <option th:each="l : ${courselevels}"
                    th:value="${l.name()}"
                    th:selected="${courseRequest.level != null and l.name() == courseRequest.level}"
                    th:text="${{
                                    BEGINNER:'Người mới bắt đầu',
                                    INTERMEDIATE:'Trung cấp',
                                    ADVANCED:'Nâng cao'
                                }[l.name()]}">
            </option>
          </select>
           <p class="text-danger"
              th:if="${#fields.hasErrors('level')}"
              th:errors="*{level}"></p>
        </div>
        <div class="form-group">
          <label>Danh Mục Chính Khóa Học</label>
          <select name="parentCategory" class="form-control" id="parentCategory">
            <option value="">Chọn Danh Mục</option>
            <option th:each="ca : ${categoryparents}"
                    th:value="${ca.id}"
                    th:text="${ca.name}">

            </option>
          </select>
          <label>Danh Mục Phụ Khóa Học</label>
          <select th:field="*{categoryId}" class="form-control" id="categoryId"
                  th:classappend="${#fields.hasErrors('categoryId')} ? ' is-invalid' : ''">
            <option value="">Chọn Danh Mục</option>
            <option th:each="c : ${categorychilds}"
                    th:value="${c.id}"
                    th:text="${c.name}"
                    th:attr="data-parent-id=${c.parentId}">
            </option>
          </select>
          <p class="text-danger"
             th:if="${#fields.hasErrors('categoryId')}"
             th:errors="*{categoryId}"></p>
        </div>
      </div>

      <!-- Giá khóa học -->
      <div class="form-group" style="margin-top:16px;">
        <label>Giá Khóa Học</label>
        <input type="text"
               class="form-control"
               th:field="*{price}"
               th:classappend="${#fields.hasErrors('price')} ? ' is-invalid' : ''"
               placeholder="Nhập giá khóa học (VNĐ)"
               inputmode="numeric"
               pattern="[0-9]*"
               autocomplete="off"
               data-price-input/>
        <div class="form-hint">Nhập 0 nếu khóa học miễn phí; giá thu phí phải lớn hơn 2.000 VNĐ và chia hết cho 1.000</div>
        <p class="text-danger"
           th:if="${#fields.hasErrors('price')}"
           th:errors="*{price}"></p>
      </div>




      <!-- Thumbnail -->
      <div class="form-group" style="margin-top:16px;">
        <label>Hình Thu Nhỏ Của Khóa Học</label>

        <div class="thumbnail-upload" onclick="document.getElementById('thumbnailInput').click()">

           <img id="thumbnailPreview"
                src=""
                th:src="${courseRequest?.thumbnailUrl != null and courseRequest?.thumbnailUrl != '' ? urlAvatar + courseRequest.thumbnailUrl : ''}"
                th:style="${courseRequest?.thumbnailUrl == null or courseRequest?.thumbnailUrl == ''} ? 'display:none;' : ''"
                alt="Thumbnail Preview"/>

          <div id="uploadPlaceholder"
               th:style="${courseRequest?.thumbnailUrl != null and courseRequest?.thumbnailUrl != ''} ? 'display:none;' : ''">
            <div class="upload-icon"></div>
            <p>Nhấn để chọn ảnh thumbnail</p>
            <small>Khuyến nghị tỉ lệ 16:9</small>
          </div>

          <div class="overlay">
            <span>📷 Thay đổi ảnh</span>
          </div>
        </div>

        <input type="file"
               id="thumbnailInput"
               name="thumbnailFile"
               accept="image/*"
               style="display:none;">
        <p
                class="text-danger"
                th:if="${#fields.hasErrors('thumbnailFile')}"
        th:errors="*{thumbnailFile}"></p>
      </div>
    </div>


    <!-- Nút Lưu -->
    <div style="text-align:right;margin-top:16px;">
      <button th:if="${courseRequest?.id == null}" type="submit" class="btn btn-primary btn-lg" name="trangthai" value="save_continue">Lưu & Tiếp Theo</button>
      <button th:if="${courseRequest?.id != null}" type="submit" class="btn btn-primary btn-lg" name="trangthai" value="save_continue">Lưu & Sửa Chương Trình</button>
      <button th:if="${courseRequest?.id != null}" type="submit" class="btn btn-primary btn-lg" name="trangthai" value="save_publish">Lưu & Gửi Request</button>
    </div>
  </form>



  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const form = document.getElementById('courseInfoForm');
      const editor = document.getElementById('courseDescEditor');

      if (form && editor) {
        form.addEventListener('submit', function () {
          document.getElementById('descHidden').value = editor.innerHTML;
        });
      }

      // Course price input: chan nhap chu va ky tu dac biet ngay o frontend.
      const priceInput = document.querySelector('[data-price-input]');
      if (priceInput) {
        priceInput.addEventListener('beforeinput', function (event) {
          if (event.data && !/^\d+$/.test(event.data)) {
            event.preventDefault();
          }
        });
        priceInput.addEventListener('input', function () {
          this.value = this.value.replace(/\D/g, '');
        });
      }

      // Ẩn category con
      const parent = document.getElementById('parentCategory');
      const child = document.getElementById('categoryId');

      function filterChildCategories(parentId, resetChild) {
        document.querySelectorAll('#categoryId option[data-parent-id]')
                .forEach(opt => {
                  opt.hidden = parentId && opt.getAttribute('data-parent-id') !== parentId;
                });

        if (resetChild) {
          child.value = '';
        }
      }

      if (parent && child) {
        const selectedChild = child.querySelector('option:checked[data-parent-id]');

        if (selectedChild) {
          parent.value = selectedChild.getAttribute('data-parent-id');
        }

        filterChildCategories(parent.value, false);

        parent.addEventListener('change', function () {
          filterChildCategories(this.value, true);
        });
      }

      // thumbnail preview
      document.getElementById("thumbnailInput")
              .addEventListener("change", function (event) {

                const file = event.target.files[0];

                if (file) {
                  const reader = new FileReader();

                  reader.onload = function (e) {
                    document.getElementById("thumbnailPreview").src = e.target.result;
                    document.getElementById("thumbnailPreview").style.display = "block";
                    document.getElementById("uploadPlaceholder").style.display = "none";
                  };

                  reader.readAsDataURL(file);
                }
              });

    });
  </script>
</div>
</html>
