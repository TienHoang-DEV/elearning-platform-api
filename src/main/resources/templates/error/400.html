<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo-background.png}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 — Yêu cầu không hợp lệ</title>
    <link rel="stylesheet" th:href="@{/css/error.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="error-page">

    <div class="error-container">
        <span class="error-label label-400">Yêu cầu không hợp lệ</span>

        <div>
            <h1 class="error-code code-400" data-code="400"
                th:text="${status != null ? status : '400'}">400</h1>
        </div>

        <hr class="error-divider divider-400">

        <h2 class="error-title"
            th:text="${error != null && error != 'Bad Request' ? error : 'Yêu cầu không hợp lệ'}">Yêu cầu không hợp lệ</h2>

        <p class="error-description"
           th:text="${message != null && message != 'Bad Request' ? message : 'Máy chủ không thể xử lý yêu cầu vì dữ liệu gửi lên không hợp lệ hoặc bị thiếu thông tin.'}">
            Máy chủ không thể xử lý yêu cầu vì dữ liệu gửi lên không hợp lệ hoặc bị thiếu thông tin.
        </p>

        <!-- Error info -->
        <div class="error-info">
            <div class="error-info-item" th:if="${timestamp != null}">
                <span class="info-label">Thời gian</span>
                <span class="info-value" th:text="${#temporals.format(timestamp, 'HH:mm:ss dd/MM/yyyy')}"></span>
            </div>
        </div>

        <!-- Actions -->
        <div class="error-actions">
            <a href="/home" class="btn-error-primary btn-400">
                <i class="bi bi-house-door"></i> Trang chủ
            </a>
            <button onclick="window.history.back();" class="btn-error-secondary">
                <i class="bi bi-arrow-left"></i> Quay lại
            </button>
        </div>

        <!-- Stack trace (if available) -->
        <div th:if="${trace != null}">
            <button class="stacktrace-toggle" onclick="toggleTrace(this)">
                <span class="toggle-icon"><i class="bi bi-chevron-down"></i></span>
                Xem chi tiết kỹ thuật
            </button>
            <div class="stacktrace-panel" id="tracePanel">
                <div class="stacktrace-header">
                    <span class="st-title">Vết lỗi hệ thống (Stack Trace)</span>
                    <button class="st-copy" onclick="copyTrace()">
                        <i class="bi bi-clipboard"></i> Sao chép
                    </button>
                </div>
                <pre class="stacktrace-body" id="traceContent" th:text="${trace}">chi tiết vết lỗi</pre>
            </div>
        </div>


    </div>

    <script>
        function toggleTrace(btn) {
            const panel = document.getElementById('tracePanel');
            btn.classList.toggle('expanded');
            panel.classList.toggle('open');
        }
        function copyTrace() {
            const text = document.getElementById('traceContent').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.st-copy');
                btn.innerHTML = '<i class="bi bi-check2"></i> Đã chép';
                setTimeout(() => { btn.innerHTML = '<i class="bi bi-clipboard"></i> Sao chép'; }, 2000);
            });
        }
    </script>
</body>
</html>
