<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Learning Hub - Thông Tin Của Tôi</title>
    <link rel="stylesheet" th:href="@{/css/course_manage.css}"/>
</head>
<body>

<!-- SIDEBAR -->
<div th:replace="~{instructor_course/sidebar :: sidebar(activePage='profile')}"></div>

<!-- MAIN -->
<main class="main-content">
    <div class="page-header">
        <h1><span class="icon"></span> Thông Tin Tài Khoản</h1>
    </div>
    <form th:action="@{/instructor/profiles}" method="post" enctype="multipart/form-data" th:object="${instructor}">
<!--        <input type="hidden" th:name="instructor_id" th:value="${instructor.id}"/>-->

        <!-- Thông tin hiển thị -->
        <div class="card">
            <div class="card-title">📋 Thông Tin Hiển Thị</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Họ và Tên Đệm <span class="required">*</span></label>
                    <input type="text" th:field="*{firstname}" class="form-control"
                           placeholder="Nhập họ và tên đệm" required/>
                    <p class="text-danger"
                       th:if="${#fields.hasErrors('firstname')}"
                       th:errors="*{firstname}">
                    </p>
                </div>

                <div class="form-group">
                    <label>Tên <span class="required">*</span></label>
                    <input type="text"  class="form-control" th:field="*{lastname}"
                           placeholder="Nhập tên" required/>
                    <p class="text-danger"
                       th:if="${#fields.hasErrors('lastname')}"
                       th:errors="*{lastname}">
                    </p>
                </div>

                <div class="form-group">
                    <label>Email (đăng ký)</label>
                    <input type="email" name="email" class="form-control" th:field="*{email}" readonly/>
                </div>

                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="text" class="form-control"
                           th:field="*{phone}"
                           placeholder="012345789"/>
                    <p class="text-danger" style="margin:4px 0 0;"
                       th:if="${#fields.hasErrors('phone')}"
                       th:errors="*{phone}"></p>
                </div>

            </div>


            <!-- Bio -->
            <div class="form-group" style="margin-bottom:16px;">
                <label>Giới Thiệu Bản Thân</label>
                <div class="rich-toolbar">
                    <button data-cmd="bold" type="button"><b>B</b></button>
                    <button data-cmd="italic" type="button"><i>I</i></button>
                    <button data-cmd="underline" type="button"><u>U</u></button>
                    <button data-cmd="insertUnorderedList" type="button">• List</button>
                    <button data-cmd="formatBlock" data-val="h3" type="button">H3</button>
                </div>
                <div class="rich-editor" id="bioEditor" contenteditable="true"
                     th:utext="${instructor?.bio}"
                     data-placeholder="Nhập mô tả ngắn giới thiệu bản thân..."></div>
                <input type="hidden" th:field="*{bio}" id="bioHidden"/>
                <p class="text-danger"
                   th:if="${#fields.hasErrors('bio')}"
                   th:errors="*{bio}">
                </p>
            </div>

            <!-- Avatar -->
            <div class="form-group">
                <label>Ảnh Đại Diện</label>
                <div style="display:flex;align-items:center;gap:12px;">
                    <div class="avatar-preview-wrap" id="avatarPreview">
                        <img th:if="${instructor?.avatar_url != null}" th:src="${instructor.avatar_url}" alt="Avatar"/>
                        <span th:if="${instructor?.avatar_url == null}"
                              th:text="${#strings.substring(instructor?.lastname,0,1) ?: 'T'}">T</span>
                    </div>
                    <div>
                        <input type="file" th:field="*{file}" id="avatarInput" accept="image/*" style="display:none;"/>
                        <button type="button" class="btn btn-outline btn-sm"
                                onclick="document.getElementById('avatarInput').click()">Chọn Ảnh</button>
                        <div class="form-hint">JPG, PNG. Tối đa 2MB.</div>
                        <p class="text-danger"
                           th:if="${#fields.hasErrors('file')}"
                           th:errors="*{file}">
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Xem trước -->
        <div class="card">
            <div class="card-title">👁 Xem Trước Hồ Sơ Giảng Viên</div>
            <div class="profile-preview-card">
                <div class="profile-preview-avatar" id="profilePreviewAvatar">
                    <img th:src="${instructor?.avatar_url ?: ''}" alt=""/>
                </div>
                <div class="profile-preview-info">
                    <h2 id="previewName"
                        th:text="${instructor != null ? instructor.firstname + ' ' + instructor.lastname : ''}"></h2>
<!--                    <span class="field-tag" id="previewField">Lĩnh vực</span>-->
                    <p id="previewBio" th:text="${instructor?.bio ?: 'Giới thiệu bản thân của bạn sẽ hiện ở đây...' }">Giới thiệu bản thân của bạn sẽ hiện ở đây...</p>
                </div>
            </div>
        </div>

        <div style="text-align:right;">
            <button type="submit" class="btn btn-primary btn-lg">Lưu Thay Đổi</button>
        </div>

        <div th:if="${success}" class="success-msg">✓ Cập nhật thành công</div>
    </form>
</main>

<script th:src="@{/js/course_instructor.js}"></script>
</body>
</html>
