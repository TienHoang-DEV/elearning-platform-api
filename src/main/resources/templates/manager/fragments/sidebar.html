<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<aside th:fragment="sidebar(activePage)" class="sidebar">
    <div class="sidebar-header">
        <h2>Hệ thống Quản lý</h2>
    </div>
    <nav class="sidebar-nav">
        <ul>
            <li th:classappend="${activePage == 'dashboard'} ? 'active' : ''">
                <a th:href="@{/manager/dashboard}">
                    <i class="ph ph-squares-four"></i>
                    <span>Tổng quan</span>
                </a>
            </li>
            <li th:classappend="${activePage == 'instructor'} ? 'active' : ''">
                <a th:href="@{/manager/instructor/list}">
                    <i class="ph ph-users"></i>
                    <span>Quản lý giảng viên</span>
                </a>
            </li>
            <li th:classappend="${activePage == 'course'} ? 'active' : ''">
                <a th:href="@{/manager/course/list}">
                    <i class="ph ph-book-open"></i>
                    <span>Phê duyệt khóa học</span>
                </a>
            </li>
            <li th:classappend="${activePage == 'revenue'} ? 'active' : ''">
                <a th:href="@{/manager/revenue/list}">
                    <i class="ph ph-currency-circle-dollar"></i>
                    <span>Doanh thu</span>
                </a>
            </li>
            <li th:classappend="${activePage == 'feedback'} ? 'active' : ''">
                <a th:href="@{/manager/feedback-report/list}">
                    <i class="ph ph-chat-circle-dots"></i>
                    <span>Phản hồi</span>
                </a>
            </li>
        </ul>
    </nav>
    <div class="sidebar-footer">
        <div class="avatar footer-avatar">
            <img th:if="${currentUser != null and currentUser.avatarUrl != null}" th:src="${currentUser.avatarUrl}" alt="Avatar" class="w-100 h-100 object-fit-cover" />
            <span th:if="${currentUser == null or currentUser.avatarUrl == null}" th:text="${currentUser != null and currentUser.firstName != null and !currentUser.firstName.isEmpty() ? #strings.substring(currentUser.firstName, 0, 1).toUpperCase() : 'M'}">M</span>
        </div>
        <div class="profile-info">
            <div class="profile-name" th:text="${currentUser != null ? (currentUser.lastName + ' ' + currentUser.firstName) : 'Quản trị viên'}">Quản trị viên</div>
            <div class="profile-email" th:text="${currentUser != null ? currentUser.email : 'admin@system.com'}">admin@system.com</div>
        </div>
    </div>
</aside>
</html>
