<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/manager-layout}">
<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo-background.png}">
    <title>Đổi mật khẩu - Quản lý Học thuật</title>
    <th:block layout:fragment="page-css">
        <link rel="stylesheet" th:href="@{/css/manager/profile.css}">
    </th:block>
</head>
<body>
    <div layout:fragment="content">
        
        <!-- Alerts for Success/Error feedback -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="profile-container-sm">
            <!-- Back button & Page Title -->
            <div class="d-flex align-items-center gap-2 mb-4">
                <a th:href="@{/manager/dashboard}" class="btn btn-outline-secondary d-flex align-items-center gap-2 px-3 py-2 rounded-3 text-decoration-none">
                    <i class="ph ph-arrow-left"></i> Quay lại
                </a>
                <h3 class="mb-0 fw-bold text-dark ms-2">Thay đổi mật khẩu</h3>
            </div>

            <!-- Profile Banner for context -->
            <div class="profile-banner mb-4">
                <div class="banner-content">
                    <div class="banner-avatar-wrap">
                        <img th:if="${user.avatarUrl != null}" th:src="${user.getFullAvatarUrl()}" alt="Avatar" class="w-100 h-100 object-fit-cover" />
                        <span th:if="${user.avatarUrl == null}" th:text="${user.firstName != null and !user.firstName.isEmpty() ? #strings.substring(user.firstName, 0, 1).toUpperCase() : 'M'}">M</span>
                    </div>
                    <div class="banner-text">
                        <h2 th:text="${user.lastName + ' ' + user.firstName}">Tên Quản Lý</h2>
                        <p th:text="${user.email}">manager@gmail.com</p>
                        <span class="badge-role">Quản lý Học thuật</span>
                    </div>
                </div>
            </div>

            <!-- Password Change Form Card -->
            <div class="card-panel">
                <div class="panel-title">
                    <i class="ph ph-key"></i>
                    <span>Thay đổi mật khẩu bảo mật</span>
                </div>
                <form th:action="@{/manager/profile/change-password}" method="post" class="mt-3">
                    <div class="form-group-custom mb-3">
                        <label for="oldPassword" class="form-label fw-semibold">Mật khẩu hiện tại</label>
                        <input type="password" id="oldPassword" name="oldPassword" class="form-control-custom" placeholder="Nhập mật khẩu hiện tại" required>
                    </div>
                    <div class="form-group-custom mb-3">
                        <label for="newPassword" class="form-label fw-semibold">Mật khẩu mới</label>
                        <input type="password" id="newPassword" name="newPassword" class="form-control-custom" minlength="6" placeholder="Ít nhất 6 ký tự" required>
                    </div>
                    <div class="form-group-custom mb-4">
                        <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu mới</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control-custom" minlength="6" placeholder="Nhập lại mật khẩu mới" required>
                    </div>
                    <div class="d-flex gap-3">
                        <button type="submit" class="btn-primary-custom w-100 justify-content-center py-2">
                            <i class="ph ph-lock-keyhole"></i> Xác nhận đổi mật khẩu
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</body>
</html>
