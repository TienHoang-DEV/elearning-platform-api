<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/manager-layout}">
<head>
    <title>Quản lý Báo cáo vi phạm</title>
    <th:block layout:fragment="page-css">
        <link rel="stylesheet" th:href="@{/css/manager/reports.css}">
    </th:block>
</head>
<body>
    <div layout:fragment="content">
        <!-- Notification Alerts -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form th:action="@{/manager/reports/list}" method="get" class="page-header page-header-top">
            <div>
                <h1>Quản lý Báo cáo vi phạm</h1>
                <p>Danh sách các báo cáo vi phạm bài học và đánh giá của học viên</p>
            </div>
            <div class="header-actions">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm nội dung..."
                    class="search-input form-control">
                
                <select name="type" class="search-input search-select form-select" onchange="this.form.submit()">
                    <option value="" th:selected="${type == null}">Tất cả loại</option>
                    <option th:each="tp : ${types}" 
                            th:value="${tp}" 
                            th:text="${tp.label}" 
                            th:selected="${type == tp}"></option>
                </select>

                <select name="status" class="search-input search-select form-select" onchange="this.form.submit()">
                    <option value="" th:selected="${status == null}">Tất cả trạng thái</option>
                    <option th:each="st : ${statuses}" 
                            th:value="${st}" 
                            th:text="${st.label}" 
                            th:selected="${status == st}"></option>
                </select>
                <button type="submit" class="d-none">Tìm kiếm</button>
            </div>
        </form>

        <div class="table-container">
            <table class="data-table reports-table">
                <thead>
                    <tr>
                        <th>Loại báo cáo</th>
                        <th>Lý do</th>
                        <th>Người báo cáo</th>
                        <th>Ngày tạo</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="report : ${requestPage.content}">
                        <td>
                            <span class="fw-bold" th:text="${report.reportTypeLabel}">Bài học</span>
                        </td>
                        <td th:text="${report.friendlyReason}">VIDEO_ISSUE</td>
                        <td th:text="${report.reporter.lastName + ' ' + report.reporter.firstName}">Nguyễn Văn A</td>
                        <td th:text="${#temporals.format(report.createdAt, 'dd/MM/yyyy HH:mm')}">23/06/2026 15:00</td>
                        <td>
                            <span th:class="${'badge badge-' + report.status.name().toLowerCase()}" 
                                  th:text="${report.statusLabel}">Trạng thái</span>
                        </td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/manager/reports/detail/{id}(id=${report.id})}"
                                    class="action-btn"><i class="ph ph-eye"></i> Xem Chi Tiết</a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${requestPage.isEmpty()}">
                        <td colspan="6" class="text-center py-4">Không tìm thấy báo cáo nào.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- ══════════ PAGINATION ══════════ -->
        <div class="pagination-circle-container mt-4" th:if="${requestPage.totalPages > 1}">
            <div class="pagination-circle-buttons d-flex justify-content-center gap-2">
                <!-- Previous -->
                <a th:if="${requestPage.hasPrevious()}"
                    th:href="@{/manager/reports/list(keyword=${keyword}, type=${type}, status=${status}, page=${requestPage.number - 1}, size=${requestPage.size})}"
                    class="btn btn-outline-secondary page-circle-btn">
                    <i class="ph ph-caret-left"></i>
                </a>
                <span th:unless="${requestPage.hasPrevious()}" class="btn btn-outline-secondary page-circle-btn disabled">
                    <i class="ph ph-caret-left"></i>
                </span>

                <!-- Page numbers -->
                <a th:each="i : ${#numbers.sequence(0, requestPage.totalPages - 1)}"
                    th:href="@{/manager/reports/list(keyword=${keyword}, type=${type}, status=${status}, page=${i}, size=${requestPage.size})}"
                    th:class="${requestPage.number == i ? 'btn btn-primary page-circle-btn active' : 'btn btn-outline-secondary page-circle-btn'}"
                    th:text="${i + 1}">1</a>

                <!-- Next -->
                <a th:if="${requestPage.hasNext()}"
                    th:href="@{/manager/reports/list(keyword=${keyword}, type=${type}, status=${status}, page=${requestPage.number + 1}, size=${requestPage.size})}"
                    class="btn btn-outline-secondary page-circle-btn">
                    <i class="ph ph-caret-right"></i>
                </a>
                <span th:unless="${requestPage.hasNext()}" class="btn btn-outline-secondary page-circle-btn disabled">
                    <i class="ph ph-caret-right"></i>
                </span>
            </div>
        </div>
    </div>
</body>
</html>
