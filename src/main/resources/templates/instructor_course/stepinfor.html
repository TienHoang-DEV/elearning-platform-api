<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!--
    FRAGMENT: step-info
    Dùng trong: course-editor.html
    th:replace="~{course-editor/step-info :: content}"
-->
<div th:fragment="content">
  <form th:action="@{/instructorcourse/save}"
        method="POST" enctype="multipart/form-data" id="courseInfoForm">

    <div class="card">
      <div class="card-title">📝 Giới Thiệu Khóa Học</div>

      <!-- Tiêu đề -->
      <div class="form-group" style="margin-bottom:16px;">
        <label>Tiêu Đề Khóa Học <span class="required">*</span></label>
        <input type="text" name="title" class="form-control" id="courseTitleInput"
               th:value="${courseRequest?.title}"
               placeholder="Tiêu đề từ 8 đến 60 ký tự" required/>
        <div class="form-hint">Tối đa 60 ký tự</div>
      </div>

      <!-- Giới thiệu ngắn -->
<!--      <div class="form-group" style="margin-bottom:16px;">-->
<!--        <label>Giới Thiệu Ngắn</label>-->
<!--        <textarea name="shortDesc" class="form-control" id="courseShortInput" rows="2"-->
<!--                  placeholder="Mô tả 1–2 câu về khóa học..."-->
<!--                  th:text="${course?.shortDesc}"></textarea>-->
<!--        <div class="form-hint">Từ 8 đến 500 ký tự</div>-->
<!--      </div>-->

      <!-- Mô tả đầy đủ -->
      <div class="form-group" style="margin-bottom:16px;">
        <label>Mô Tả Khóa Học</label>
        <div class="rich-toolbar">
          <button data-cmd="bold" type="button"><b>B</b></button>
          <button data-cmd="italic" type="button"><i>I</i></button>
          <button data-cmd="underline" type="button"><u>U</u></button>
          <button data-cmd="insertUnorderedList" type="button">• List</button>
          <button data-cmd="insertOrderedList" type="button">1. List</button>
          <button data-cmd="formatBlock" data-val="h3" type="button">H3</button>
          <button data-cmd="removeFormat" type="button">✕</button>
        </div>
        <div class="rich-editor" id="courseDescEditor" contenteditable="true"
             th:utext="${courseRequest?.description}"
             data-placeholder="Nhập mô tả đầy đủ cho khóa học..."></div>
        <input type="hidden" name="description" id="descHidden"/>
      </div>

      <!-- Level & Category -->
      <div class="form-grid" style="margin-top:16px;">
        <div class="form-group">
          <label>Trình Độ Khóa Học</label>
          <select name="level" class="form-control">
            <option value="">Chọn Trình Độ</option>
            <option th:each="l : ${courselevels}"
                    th:value="${l}"
                    th:text="${{
                                    BEGINNER:'Người mới bắt đầu',
                                    INTERMEDIATE:'Trung cấp',
                                    ADVANCED:'Nâng cao'
                                }[l.name()]}">
            </option>
          </select>
        </div>
        <div class="form-group">
          <label>Danh Mục Chính Khóa Học</label>
          <select name="parentCategory" class="form-control" id="parentCategory">
            <option value="">Chọn Danh Mục</option>
            <option th:each="ca : ${categoryparents}"
                    th:value="${ca.id}"
                    th:text="${ca.name}">

            </option>
          </select>
          <label>Danh Mục Phụ Khóa Học</label>
          <select name="categoryId" class="form-control" id="categoryId">
            <option value="">Chọn Danh Mục</option>
            <option th:each="c : ${categorychilds}"
                    th:value="${c.id}"
                    th:text="${c.name}"
                    th:attr="data-parent-id=${c.parentId}">
            </option>
          </select>
        </div>
      </div>

      <!-- Giá khóa học -->
      <div class="form-group" style="margin-top:16px;">
        <label>Giá Khóa Học</label>
        <input type="number"
               name="price"
               class="form-control"
               th:value="${courseRequest?.price}"
               placeholder="Nhập giá khóa học (VNĐ)"
               min="0"/>
        <div class="form-hint">Nhập 0 nếu khóa học miễn phí</div>
      </div>


      <!-- Thumbnail -->
      <div class="form-group" style="margin-top:16px;">
        <label>Hình Thu Nhỏ Của Khóa Học</label>

        <!-- Ảnh đã có từ DB -->
        <div th:if="${courseRequest?.thumbnailFile != null}" style="margin-bottom:8px;">
          <img th:src="${courseRequest.thumbnailFile}"
               style="width:320px; height:180px; object-fit:cover; border-radius:8px; display:block;"
               alt="Thumbnail"/>
        </div>

        <div class="file-upload-area" onclick="document.getElementById('thumbnailInput').click()"
             style="max-width:320px;">
          <div class="upload-icon">🖼️</div>
          <p>Nhấn để chọn ảnh thumbnail (16:9 khuyến nghị)</p>
          <p style="font-size:.75rem;margin-top:4px;color:#aaa;">JPG, PNG – Tối đa 5MB</p>
          <span class="choose-btn">Chọn Ảnh</span>
        </div>
        <input type="file" id="thumbnailInput" name="thumbnailFile" accept="image/*" style="display:none;"/>
      </div>
    </div>

    <!-- Xem trước -->
    <div class="card">
      <div class="card-title">👁 Xem Trước Giới Thiệu Khóa Học</div>
      <div class="preview-panel">
        <div class="preview-panel-header">👁 XEM TRƯỚC</div>
        <div class="preview-panel-body">
          <div class="course-preview-banner" id="courseBanner">
            <h2 id="previewCourseTitle"
                th:text="${courseRequest?.title ?: 'Tiêu đề khóa học sẽ hiện ở đây'}"></h2>
<!--            <p id="previewCourseShort"-->
<!--               th:text="${courseRequest?.shortDesc ?: 'Mô tả ngắn về khóa học...'}"></p>-->
          </div>
        </div>
      </div>
    </div>

    <!-- Nút Lưu -->
    <div style="text-align:right;margin-top:16px;">
      <a th:href="@{/instructor/courses}" class="btn btn-outline">Hủy</a>
      <button type="submit" class="btn btn-primary btn-lg">💾 Lưu & Tiếp Theo →</button>
    </div>
  </form>
  <p th:if="${error}" th:text="${error}" class="text-danger"></p>
  <p th:if="${success}" th:text="${success}"></p>


  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const form = document.getElementById('courseInfoForm');
      const editor = document.getElementById('courseDescEditor');

      if (form && editor) {
        form.addEventListener('submit', function () {
          document.getElementById('descHidden').value = editor.innerHTML;
        });
      }

      // Ẩn category con
      document.querySelectorAll('#categoryId option[data-parent-id]')
              .forEach(opt => opt.hidden = true);

      const parent = document.getElementById('parentCategory');
      const child = document.getElementById('categoryId');

      if (parent && child) {
        parent.addEventListener('change', function () {
          const parentId = this.value;

          child.value = '';

          document.querySelectorAll('#categoryId option[data-parent-id]')
                  .forEach(opt => {
                    opt.hidden = opt.getAttribute('data-parent-id') !== parentId;
                  });
        });
      }

      // thumbnail preview
      const thumbnailInput = document.getElementById('thumbnailInput');

      if (thumbnailInput) {
        thumbnailInput.addEventListener('change', function () {
          const file = this.files[0];
          if (!file) return;

          let preview = document.getElementById('thumbnailPreview');

          if (!preview) {
            preview = document.createElement('img');
            preview.id = 'thumbnailPreview';
            preview.style.cssText =
                    'width:320px;height:180px;object-fit:cover;border-radius:8px;display:block;margin-bottom:8px;';

            const uploadArea = document.querySelector('.file-upload-area');
            uploadArea.parentNode.insertBefore(preview, uploadArea);
          }

          preview.src = URL.createObjectURL(file);
        });
      }

    });
  </script>
</div>
</html>
