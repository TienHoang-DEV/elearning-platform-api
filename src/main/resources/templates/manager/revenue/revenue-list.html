<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/manager-layout}">
<head>
    <title>Academic Manager - Quản lý Doanh thu</title>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <th:block layout:fragment="page-css">
        <link rel="stylesheet" th:href="@{/css/manager/revenue.css}">
    </th:block>
</head>
<body>
    <div layout:fragment="content">
        <div class="page-header d-flex justify-content-between align-items-end">
            <div>
                <h1>Báo cáo Doanh thu</h1>
                <p>Tổng quan về tài chính và doanh thu của hệ thống.</p>
            </div>
            <button class="btn btn-outline">Xem tất cả giao dịch <i class="ph ph-arrow-right"></i></button>
        </div>
        <div class="rev-grid">
            <div class="rev-card primary">
                <h3>Tổng doanh thu (Tháng)</h3>
                <div class="rev-val">$12,450.00</div>
                <div class="rev-sub">↗ +15.3% so với tháng trước</div>
            </div>
            <div class="rev-card">
                <h3>Thanh toán cho Giảng viên</h3>
                <div class="rev-val">$8,715.00</div>
            </div>
            <div class="rev-card">
                <h3>Phí nền tảng (Thực nhận)</h3>
                <div class="rev-val">$3,735.00</div>
            </div>
        </div>
        <div class="chart-section mt-4">
            <h2>Xu hướng Doanh thu hàng tháng</h2>
            <div class="chart-container">
                <canvas id="revLineChart"></canvas>
            </div>
        </div>
    </div>

    <th:block layout:fragment="page-js">
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const ctx = document.getElementById('revLineChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['Tuần 1', 'Tuần 2', 'Tuần 3', 'Tuần 4'],
                        datasets: [{
                            label: 'Doanh thu',
                            data: [700, 1400, 2100, 2800],
                            borderColor: '#0056b3',
                            backgroundColor: 'rgba(0, 86, 179, 0.1)',
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, max: 2800, ticks: { stepSize: 700, callback: v => '$' + v } },
                            x: { grid: { display: false } }
                        }
                    }
                });
            });
        </script>
    </th:block>
</body>
</html>
