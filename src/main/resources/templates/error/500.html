<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Lỗi hệ thống</title>
    <link rel="stylesheet" th:href="@{/css/error.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="error-page">

    <div class="error-container">
        <span class="error-label label-500">Internal Server Error</span>

        <div>
            <h1 class="error-code code-500" data-code="500"
                th:text="${status != null ? status : '500'}">500</h1>
        </div>

        <hr class="error-divider divider-500">

        <h2 class="error-title"
            th:text="${error != null ? error : 'Đã xảy ra sự cố hệ thống'}">Đã xảy ra sự cố hệ thống</h2>

        <p class="error-description"
           th:text="${message != null ? message : 'Máy chủ gặp lỗi bất ngờ khi xử lý yêu cầu của bạn. Vui lòng thử lại sau.'}">
            Máy chủ gặp lỗi bất ngờ khi xử lý yêu cầu của bạn. Vui lòng thử lại sau.
        </p>

        <!-- Error info -->
        <div class="error-info">
            <div class="error-info-item" th:if="${path != null}">
                <span class="info-label">Đường dẫn</span>
                <span class="info-value" th:text="${path}"></span>
            </div>
            <div class="error-info-item">
                <span class="info-label">Mã lỗi</span>
                <span class="info-value" th:text="${status != null ? status : '500'}">500</span>
            </div>
            <div class="error-info-item" th:if="${timestamp != null}">
                <span class="info-label">Thời gian</span>
                <span class="info-value" th:text="${#temporals.format(timestamp, 'HH:mm:ss dd/MM/yyyy')}"></span>
            </div>
        </div>

        <!-- Actions -->
        <div class="error-actions">
            <button onclick="window.location.reload();" class="btn-error-primary btn-500">
                <i class="bi bi-arrow-clockwise"></i> Thử lại
            </button>
            <button onclick="window.history.back();" class="btn-error-secondary">
                <i class="bi bi-arrow-left"></i> Quay lại
            </button>
            <a href="/home" class="btn-error-secondary">
                <i class="bi bi-house-door"></i> Trang chủ
            </a>
        </div>

        <!-- Stack trace (if available) -->
        <div th:if="${trace != null}">
            <button class="stacktrace-toggle" onclick="toggleTrace(this)">
                <span class="toggle-icon"><i class="bi bi-chevron-down"></i></span>
                Xem chi tiết kỹ thuật
            </button>
            <div class="stacktrace-panel" id="tracePanel">
                <div class="stacktrace-header">
                    <span class="st-title">Stack Trace</span>
                    <button class="st-copy" onclick="copyTrace()">
                        <i class="bi bi-clipboard"></i> Sao chép
                    </button>
                </div>
                <pre class="stacktrace-body" id="traceContent" th:text="${trace}">stack trace here</pre>
            </div>
        </div>


    </div>

    <script>
        function toggleTrace(btn) {
            const panel = document.getElementById('tracePanel');
            btn.classList.toggle('expanded');
            panel.classList.toggle('open');
        }
        function copyTrace() {
            const text = document.getElementById('traceContent').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.st-copy');
                btn.innerHTML = '<i class="bi bi-check2"></i> Đã chép';
                setTimeout(() => { btn.innerHTML = '<i class="bi bi-clipboard"></i> Sao chép'; }, 2000);
            });
        }
    </script>
</body>
</html>
