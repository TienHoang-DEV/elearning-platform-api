<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Đánh giá khóa học</title>
    <link rel="stylesheet" th:href="@{/css/course_manage.css}"/>
</head>
<body>

<div th:replace="~{instructor_course/sidebar :: sidebar(activePage='courses')}"></div>

<main class="main-content">
    <div class="page-header">
        <div>
            <h1>Đánh giá khóa học</h1>
            <p class="page-subtitle" th:text="${course.title}">Tên khóa học</p>
        </div>
        <a th:href="@{/instructorcourse/courses(tab='all')}" class="btn btn-outline">Quay lại danh sách</a>
    </div>

    <div class="card instructor-reviews-panel">
        <div class="card-title">Danh sách đánh giá</div>

        <!-- Backend đã kiểm quyền và truyền reviews của đúng course sang đây. -->
        <div class="table-empty" th:if="${reviews == null or #lists.isEmpty(reviews)}">
            Khóa học này chưa có đánh giá.
        </div>

        <div class="instructor-review-list" th:if="${reviews != null and not #lists.isEmpty(reviews)}">
            <article class="instructor-review-item" th:each="review : ${reviews}">
                <div class="instructor-review-head">
                    <div>
                        <strong th:text="${review.user != null ? review.user.firstName + ' ' + review.user.lastName : 'Học viên'}">
                            Học viên
                        </strong>
                        <div class="course-card-meta"
                             th:text="${review.createdAt != null ? #temporals.format(review.createdAt, 'dd-MM-yyyy HH:mm') : ''}">
                            01-01-2026
                        </div>
                    </div>
                    <div class="review-stars">
                        <span th:each="i : ${#numbers.sequence(1, 5)}"
                              th:text="${i <= review.rating ? '★' : '☆'}">★</span>
                    </div>
                </div>
                <p class="instructor-review-comment" th:text="${review.comment ?: 'Không có nhận xét.'}">
                    Nội dung đánh giá
                </p>
            </article>
        </div>
    </div>
</main>

</body>
</html>
