<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!--
    FRAGMENT: step-pricing
    Dùng trong: course-editor.html
    th:replace="~{course-editor/step-pricing :: content}"
-->
<div th:fragment="content">
    <form th:action="@{/instructor/courses/{id}/edit/pricing(id=${course.id})}" method="POST">

        <div class="card">
            <div class="card-title">💰 Giá Khóa Học</div>

            <div class="alert alert-warning">
                ⚠️ Giá khóa học sau khi đặt sẽ cố định. Bạn chỉ có thể giảm giá qua voucher khuyến mãi.
            </div>

            <!-- Giá -->
            <div class="form-group" style="margin-bottom:20px;">
                <label>Giá Bán Khóa Học <span class="required">*</span></label>
                <div style="display:flex;align-items:center;gap:10px;">
                    <input type="number" id="priceInput" name="price" class="form-control"
                           th:value="${course?.salePrice}"
                           placeholder="VD: 299000" min="20000" style="max-width:220px;"/>
                    <span style="font-weight:600;color:var(--text-muted);">VNĐ</span>
                </div>
                <div class="form-hint">Giá tối thiểu: 20,000 VNĐ</div>
                <div style="margin-top:12px;">
                    <div class="price-display" id="priceDisplay">
                        <span th:text="${course?.salePrice != null ?
                            #numbers.formatInteger(course.salePrice,0,'COMMA') + ' VNĐ' : '0 VNĐ'}">0 VNĐ</span>
                    </div>
                    <small style="color:var(--text-muted);">Giá hiển thị cho học viên</small>
                </div>
            </div>

            <hr class="divider"/>

            <!-- Voucher -->
            <div class="section-title-bar" style="margin-bottom:14px;">
                <h3>🎟️ Mã Voucher Khuyến Mãi</h3>
            </div>

            <!-- Danh sách voucher đã tạo -->
            <div class="table-wrap" th:if="${vouchers != null and not #lists.isEmpty(vouchers)}"
                 style="margin-bottom:16px;">
                <table>
                    <thead>
                    <tr>
                        <th>Mã Voucher</th>
                        <th>Giảm (%)</th>
                        <th>Hết Hạn</th>
                        <th>Thao Tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="v : ${vouchers}">
                        <td th:text="${v.code}"></td>
                        <td th:text="${v.discount + '%'}"></td>
                        <td th:text="${v.expiredAt != null ? #temporals.format(v.expiredAt,'dd/MM/yyyy') : '—'}"></td>
                        <td>
                            <form th:action="@{/instructor/vouchers/{id}/delete(id=${v.id})}" method="POST"
                                  style="display:inline;">
                                <button type="submit" class="btn btn-sm btn-danger"
                                        onclick="return confirm('Xóa voucher này?')">🗑 Xóa</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Thêm voucher mới -->
            <div class="voucher-row">
                <input type="text" id="voucherCodeInput" name="voucherCode" class="form-control"
                       placeholder="Mã voucher (VD: SUMMER25)" style="max-width:200px;"/>
                <input type="number" id="voucherDiscountInput" name="voucherDiscount" class="form-control"
                       placeholder="% Giảm (VD: 20)" min="1" max="100" style="max-width:160px;"/>
                <button type="button" class="btn btn-success" id="addVoucherBtn">+ Thêm Voucher</button>
            </div>
            <div class="voucher-list" id="voucherList"></div>
        </div>

        <!-- Nút điều hướng -->
        <div class="gap-row" style="margin-top:16px;">
            <a th:href="@{/instructor/courses/{id}/edit/info(id=${course.id})}"
               class="btn btn-outline">← Quay Lại</a>
            <button type="submit" class="btn btn-primary">💾 Lưu & Tiếp Theo →</button>
        </div>
    </form>
</div>
</html>
