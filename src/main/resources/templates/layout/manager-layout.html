<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Academic Manager">Academic Manager</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Manager Layout CSS -->
    <link rel="stylesheet" th:href="@{/css/manager/layout.css}">
    
    <th:block layout:fragment="page-css"></th:block>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a class="header-logo d-flex align-items-center gap-2 text-decoration-none" th:href="@{/}">
                    <i class="fa-solid fa-layer-group logo-fa-layers"></i>
                    <span class="logo-text fw-bold font-heading">LearningHub</span>
                </a>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a th:href="@{/manager/dashboard}"><i class="ph ph-squares-four"></i><span>Tổng quan</span></a>
                    </li>
                    <li>
                        <a th:href="@{/manager/instructor/list}"><i class="ph ph-users"></i><span>Quản lý giảng viên</span></a>
                    </li>
                    <li>
                        <a th:href="@{/manager/course/list}"><i class="ph ph-book-open"></i><span>Phê duyệt khóa học</span></a>
                    </li>
                    <li>
                        <a th:href="@{/manager/revenue/list}"><i class="ph ph-currency-circle-dollar"></i><span>Doanh thu</span></a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <div class="avatar footer-avatar">
                    <img th:if="${currentUser != null and currentUser.avatarUrl != null}" th:src="${currentUser.avatarUrl}" alt="Avatar" class="w-100 h-100 object-fit-cover" />
                    <span th:if="${currentUser == null or currentUser.avatarUrl == null}" th:text="${currentUser != null and currentUser.firstName != null and !currentUser.firstName.isEmpty() ? #strings.substring(currentUser.firstName, 0, 1).toUpperCase() : 'M'}">M</span>
                </div>
                <div class="profile-info">
                    <div class="profile-name" th:text="${currentUser != null ? (currentUser.lastName + ' ' + currentUser.firstName) : 'Quản trị viên'}">Quản trị viên</div>
                    <div class="profile-email" th:text="${currentUser != null ? currentUser.email : 'admin@system.com'}">admin@system.com</div>
                </div>
            </div>
        </aside>

        <div class="main-wrapper">
            <main class="content">
                <div layout:fragment="content">
                    <!-- Dynamic content will be injected here -->
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const path = window.location.pathname;
            const items = document.querySelectorAll(".sidebar-nav ul li");
            items.forEach(li => {
                const a = li.querySelector("a");
                if (a) {
                    const href = a.getAttribute("href");
                    if (href === "/manager/dashboard" && (path === "/manager" || path === "/manager/" || path.startsWith("/manager/dashboard"))) {
                        li.classList.add("active");
                    } else if (href !== "/manager/dashboard" && path.startsWith(href.substring(0, href.lastIndexOf('/')))) {
                        li.classList.add("active");
                    }
                }
            });
        });
    </script>
    <th:block layout:fragment="page-js"></th:block>
</body>
</html>
