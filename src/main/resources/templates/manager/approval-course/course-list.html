<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Manager - Quản lý Khóa học</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../../../static/css/manager/course.css" th:href="@{/css/manager/course.css}">
</head>
<body>
    <div class="app-container">
        <aside th:replace="~{manager/fragments/sidebar :: sidebar(activePage='course')}"></aside>

        <div class="main-wrapper">
            <main class="content">
                <form th:action="@{/manager/course/list}" method="get" class="page-header page-header-flex">
                    <div>
                        <h1>Phê duyệt Khóa học</h1>
                        <p>Xem xét, phê duyệt và quản lý các khóa học trên nền tảng.</p>
                    </div>
                    <div class="header-actions">
                        <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm khóa học..." class="search-input form-control">
                        <select name="status" class="search-input search-select form-select" onchange="this.form.submit()">
                            <option value="" th:selected="${status == null or status == ''}">Tất cả trạng thái</option>
                            <option value="PENDING" th:selected="${status == 'PENDING'}">Đang chờ duyệt</option>
                            <option value="PUBLISHED" th:selected="${status == 'PUBLISHED'}">Đã duyệt</option>
                            <option value="REJECTED" th:selected="${status == 'REJECTED'}">Từ chối</option>
                        </select>
                        <button type="submit" class="hidden-btn">Search</button>
                    </div>
                </form>

                <div class="course-grid">
                    <div class="course-card" th:each="course : ${coursePage.content}">
                        <img th:src="${course.thumbnailPath}" class="course-image" alt="Course Thumbnail">
                        <div class="course-body">
                            <div class="course-meta">
                                <span th:if="${course.status == 'PENDING'}" class="badge badge-warning">Đang chờ duyệt</span>
                                <span th:if="${course.status == 'PUBLISHED'}" class="badge badge-success">Đã duyệt</span>
                                <span th:if="${course.status == 'REJECTED'}" class="badge badge-danger">Từ chối</span>
                                <span class="course-price" th:text="${course.price != null ? #numbers.formatDecimal(course.price, 0, 'POINT', 0, 'COMMA') + ' đ' : 'Miễn phí'}">$49.99</span>
                            </div>
                            <div class="course-title" th:text="${course.title}">Các Mẫu React Nâng Cao</div>
                            <div class="course-instructor" th:text="${course.instructor != null ? course.instructor.firstName + ' ' + course.instructor.lastName : 'Không rõ'}">Michael Chang</div>
                            <div class="course-category d-flex align-items-center gap-1 mt-2 text-muted" style="font-size: 0.85rem;">
                                <span th:text="${course.category != null ? course.category.name : 'Chưa phân loại'}">Danh mục</span>
                            </div>
                        </div>
                        <div class="course-footer">
                            <div class="actions">
                                <i class="ph ph-eye"></i>
                                <a th:href="@{/manager/course/detail/{id}(id=${course.id})}" class="action-link">Xem Chi Tiết</a>
                            </div>
                        </div>
                    </div>

                    <div th:if="${coursePage.empty}" class="empty-grid-message">
                        Không tìm thấy khóa học nào.
                    </div>
                </div>

                <!-- ══════════ PAGINATION ══════════ -->
                <div class="pagination-circle-container" th:if="${coursePage.totalPages > 1}">
                    <div class="pagination-circle-buttons">
                        <!-- Previous -->
                        <a th:if="${coursePage.hasPrevious()}"
                            th:href="@{/manager/course/list(keyword=${keyword}, status=${status}, page=${coursePage.number - 1}, size=${coursePage.size})}"
                            class="page-circle-btn">
                            <i class="ph ph-caret-left"></i>
                        </a>
                        <span th:unless="${coursePage.hasPrevious()}" class="page-circle-btn disabled">
                            <i class="ph ph-caret-left"></i>
                        </span>

                        <!-- Page numbers -->
                        <a th:each="i : ${#numbers.sequence(0, coursePage.totalPages - 1)}"
                            th:href="@{/manager/course/list(keyword=${keyword}, status=${status}, page=${i}, size=${coursePage.size})}"
                            th:class="${coursePage.number == i ? 'page-circle-btn active' : 'page-circle-btn'}"
                            th:text="${i + 1}">1</a>

                        <!-- Next -->
                        <a th:if="${coursePage.hasNext()}"
                            th:href="@{/manager/course/list(keyword=${keyword}, status=${status}, page=${coursePage.number + 1}, size=${coursePage.size})}"
                            class="page-circle-btn">
                            <i class="ph ph-caret-right"></i>
                        </a>
                        <span th:unless="${coursePage.hasNext()}" class="page-circle-btn disabled">
                            <i class="ph ph-caret-right"></i>
                        </span>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
