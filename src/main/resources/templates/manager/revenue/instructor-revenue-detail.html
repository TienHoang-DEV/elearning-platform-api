<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/manager-layout}">
<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo-background.png}">
    <title>Academic Manager - Chi tiết doanh thu giảng viên</title>
    <th:block layout:fragment="page-css">
        <link rel="stylesheet" th:href="@{/css/manager/revenue.css}">
    </th:block>
</head>
<body>
    <div layout:fragment="content">
        <!-- Page Header -->
        <div class="page-header d-flex justify-content-between align-items-end mb-4">
            <div>
                <h1>CHI TIẾT DOANH THU GIẢNG VIÊN</h1>
                <p class="text-muted">
                    Giảng viên: <span class="fw-bold text-dark" th:text="${instructorName}">Tên Giảng Viên</span> 
                    &bull; Email: <span class="fw-semibold text-secondary" th:text="${instructorEmail}">email@fpt.edu.vn</span>
                </p>
            </div>
            <a th:href="@{/manager/revenue/instructor(month=${month}, year=${year})}" class="btn btn-outline">
                <i class="ph ph-arrow-left"></i> Quay lại
            </a>
        </div>


        <!-- Course Table Card -->
        <div class="transaction-card-table">
            <div class="card-table-header">
                <h2>CHI TIẾT DOANH THU THEO TỪNG KHÓA HỌC</h2>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th scope="col" style="width: 40%;">Tên khóa học</th>
                            <th scope="col" class="text-end" style="width: 15%;">Giá khóa học</th>
                            <th scope="col" class="text-center" style="width: 15%;">Số lượt đăng ký</th>
                            <th scope="col" class="text-end" style="width: 15%;">Tổng doanh thu</th>
                            <th scope="col" class="text-end" style="width: 15%;">Thực nhận (70%)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="course : ${courseDetails}">
                            <td>
                                <div class="fw-semibold text-wrap text-dark" th:text="${course.title}">Tên Khóa Học</div>
                                <small class="text-muted" th:text="'Mã KH: #' + ${course.courseId}">#1</small>
                            </td>
                            <td class="text-end text-secondary" th:text="${#numbers.formatDecimal(course.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                0 đ
                            </td>
                            <td class="text-center">
                                <span class="badge bg-light text-dark px-3 py-2 fw-semibold" th:text="${course.salesCount}">0</span>
                            </td>
                            <td class="text-end fw-semibold text-secondary" th:text="${#numbers.formatDecimal(course.totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                0 đ
                            </td>
                            <td class="text-end fw-bold text-success" 
                                th:text="${#numbers.formatDecimal(course.instructorShare, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                0 đ
                            </td>
                        </tr>
                        <tr th:if="${courseDetails == null or courseDetails.isEmpty()}">
                            <td colspan="5" class="text-center text-muted py-5">
                                <i class="ph ph-info fs-1 d-block mb-2 text-secondary"></i>
                                Giảng viên này chưa có doanh thu khóa học nào.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
