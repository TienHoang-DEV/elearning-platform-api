<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Learning Hub - Chỉnh Sửa Khóa Học</title>
    <link rel="stylesheet" th:href="@{/css/course_manage.css}"/>
</head>
<body>

<!-- SIDEBAR -->
<div th:replace="~{instructor_course/sidebar :: sidebar(activePage='courses')}"></div>

<!-- MAIN -->
<main class="main-content">
    <div class="page-header">
        <h1>
            <span class="icon">✏️</span>
            <span th:text="${courseRequest != null ? courseRequest.title : 'Tạo Khóa Học Mới'}">Khóa Học</span>
        </h1>
        <a th:href="@{/instructorcourse/courses}" class="btn btn-outline">← Quay lại danh sách</a>
    </div>

    <!-- Wizard Notice -->
    <div class="wizard-notice">
        ⚠️ <strong>Lưu ý:</strong> Hoàn thành từng bước và nhấn Lưu trước khi chuyển bước tiếp theo.
    </div>

    <!-- Wizard Steps -->
    <div class="wizard-steps">
<!--        <a th:href="@{/instructor/courses/{id}/edit/info(id=${courseRequest.id})}"-->
<!--           class="wizard-step" th:classappend="${activeStep == 'info'} ? 'active' : ''">-->
        <a th:href="${courseRequest?.id != null}
               ? @{/instructor/courses/{id}/edit/info(id=${courseRequest.id})}
               : '#'"
           class="wizard-step" th:classappend="${activeStep == 'info'} ? 'active' : ''">
            <div class="step-dot">1</div>
            <div class="step-label">GIỚI THIỆU<br/>KHÓA HỌC</div>
        </a>

        <a th:href="${courseRequest?.id != null}
               ? @{/instructor/courses/{id}/edit/curriculum(id=${courseRequest.id})}
               : '#'"
           class="wizard-step" th:classappend="${activeStep == 'curriculum'} ? 'active' : ''">
            <div class="step-dot">2</div>
            <div class="step-label">CHƯƠNG TRÌNH<br/>GIẢNG DẠY</div>
        </a>

        <a th:href="${courseRequest?.id != null}
               ? @{/instructor/courses/{id}/edit/quiz(id=${courseRequest.id})}
               : '#'"
           class="wizard-step" th:classappend="${activeStep == 'quiz'} ? 'active' : ''">
            <div class="step-dot">3</div>
            <div class="step-label">CÂU HỎI ÔN TẬP</div>
        </a>

        <a th:href="${courseRequest?.id != null}
               ? @{/instructor/courses/{id}/edit/publish(id=${courseRequest.id})}
               : '#'"
           class="wizard-step" th:classappend="${activeStep == 'publish'} ? 'active' : ''">
            <div class="step-dot">4</div>
            <div class="step-label">XUẤT BẢN</div>
        </a>
    </div>

    <div th:if="${activeStep == 'info'}"
         th:insert="~{instructor_course/stepinfor :: content}"></div>
    <div th:if="${activeStep == 'curriculum'}"
         th:insert="~{instructor_course/stepcurriculum :: content}"></div>
    <div th:if="${activeStep == 'quiz'}"
         th:insert="~{instructor_course/stepquizz :: content}"></div>

</main>

<!-- Modals dùng chung cho editor -->
<div th:replace="~{instructor_course/modals :: all}"></div>

<script th:src="@{/js/course_instructor.js}"></script>
</body>
</html>
