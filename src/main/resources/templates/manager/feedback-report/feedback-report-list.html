<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Manager - Quản lý Phản hồi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../../../static/css/manager/feedback.css" th:href="@{/css/manager/feedback.css}">
</head>
<body>
    <div class="app-container">
        <aside th:replace="~{manager/fragments/sidebar :: sidebar(activePage='feedback')}"></aside>

        <div class="main-wrapper">
            <main class="content">
                <div class="page-header d-flex justify-content-between align-items-end">
                    <div>
                        <h1>Phản hồi Bị báo cáo</h1>
                        <p>Kiểm duyệt các đánh giá và bình luận của người dùng.</p>
                    </div>
                    <div class="header-actions">
                        <input type="text" placeholder="Tìm kiếm theo khóa học hoặc học viên..." class="search-input form-control feedback-search">
                        <select class="search-input form-select feedback-select">
                            <option value="">Tất cả trạng thái</option>
                            <option value="PENDING">Chờ xử lý</option>
                            <option value="VIOLATION">Vi phạm</option>
                        </select>
                    </div>
                </div>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr><th>Khóa học</th><th>Học viên</th><th>Lượt báo cáo</th><th>Trạng thái</th><th>Thao tác</th></tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><strong>Các Mẫu React Nâng Cao</strong></td>
                                <td>Trần Văn C</td>
                                <td><span class="report-count warning">⚠️ 3</span></td>
                                <td><span class="badge badge-warning">PENDING</span></td>
                                <td><div class="actions"><i class="ph ph-eye"></i><a href="#" class="action-link">Kiểm duyệt</a></div></td>
                            </tr>
                            <tr>
                                <td><strong>Nhập môn Học Máy</strong></td>
                                <td>Lê Thị D</td>
                                <td><span class="report-count danger">⚠️ 12</span></td>
                                <td><span class="badge badge-danger">VIOLATION</span></td>
                                <td><div class="actions"><i class="ph ph-eye"></i><a href="#" class="action-link">Kiểm duyệt</a></div></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
