<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${courseDetal.tittle}"></title>
    <link rel="icon" type="image/png" th:href="@{/images/logo-background.png}">
    <meta name="description"
          content="Chi tiết bài học khóa học Guitar điện cơ bản cùng Khoa tại Learning Hub.">

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Central Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <!-- Header Custom Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <!-- Course Player Page Custom Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/learning.css}">

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .instructor-course-summary,
        .instructor-course-summary * {
            min-width: 0;
        }

        .instructor-course-title,
        .course-lesson-title,
        .instructor-course-description {
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .instructor-course-title {
            max-width: 100%;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .instructor-course-description {
            max-width: 100%;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>

<body class="bg-white">


<!-- Main Course Player Layout -->
<div class="container-fluid p-0 mb-3">
    <div class="row g-0">

        <!-- Left Panel: Video & Tabs (70%) -->
        <main class="col-lg-8 col-12 main-player-content" style="min-width:0;">

            <!-- Course Info Section -->
            <div class="border-bottom bg-light bg-opacity-25">
                <div class="px-4 py-3 border-bottom bg-white d-flex align-items-center justify-content-between gap-3 flex-wrap">
                    <a th:href="${backUrl != null ? backUrl : '/instructor/courses'}"
                       class="btn btn-outline-primary btn-sm d-inline-flex align-items-center gap-2">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>Quay lại</span>
                    </a>
                </div>
                <div class="row g-4 align-items-start p-4">
                    <!-- Course Thumbnail -->
                    <div class="col-xl-3 col-lg-4 col-12">
                        <img th:src="${courseDetal.thumnaiUrl != null} ? ${urlAvatar + courseDetal.thumnaiUrl} : 'https://via.placeholder.com/300x200?text=Khóa+Học'"
                             alt="Course Thumbnail" class="img-fluid rounded-3" style="width: 100%; object-fit: cover; height: 180px;">
                    </div>

                    <!-- Course Details -->
                    <div class="col-xl-9 col-lg-8 col-12 instructor-course-summary">
                        <h2 class="fw-bold font-heading mb-3 lh-sm instructor-course-title" th:text="${courseDetal.tittle}">
                            Tên khóa học
                        </h2>

                        <div class="row g-3 mb-3">
                            <div class="col-6 col-lg-3">
                                <label class="fw-semibold text-muted fs-8 d-block">Giá Bán</label>
                                <span class="fs-7 fw-bold text-dark" th:text="${#numbers.formatInteger(courseDetal.price, 0, 'COMMA')} + ' VNĐ'">0 VNĐ</span>
                            </div>
                            <div class="col-6 col-lg-3">
                                <label class="fw-semibold text-muted fs-8 d-block">Danh Mục</label>
                                <span class="fs-7 fw-bold text-dark" th:text="${courseDetal.category}">Danh mục</span>
                            </div>
                            <div class="col-6 col-lg-3">
                                <label class="fw-semibold text-muted fs-8 d-block">Cấp Độ</label>
                                <span class="badge bg-success text-white fs-8 px-2 py-1" th:text="${courseDetal.level}">Level</span>
                            </div>
                            <div class="col-6 col-lg-3">
                                <label class="fw-semibold text-muted fs-8 d-block">Ngày Tạo</label>
                                <span class="fs-7 fw-bold text-dark" th:text="${#temporals.format(courseDetal.createAt, 'dd-MM-yyyy')}">--</span>
                            </div>
                        </div>

                        <div class="text-muted fs-7 mb-0 instructor-course-description" th:utext="${courseDetal.description}">Mô tả khóa học</div>
                    </div>
                </div>
            </div>

            <!-- Video Player Screen -->
            <div class="video-player-container position-relative overflow-hidden bg-dark">
                <video id="lesson-video" class="w-100"
                       style="height: 700px; object-fit: cover;" controls controlsList="nodownload" preload="metadata"
                       playsinline
                       th:src="${courseDetal.introVideoPreviewUrl != null and courseDetal.introVideoPreviewUrl != '' ? courseDetal.introVideoPreviewUrl : ''}"
                       th:poster="${urlAvatar + courseDetal.thumnaiUrl}">
                    Trình duyệt của bạn không hỗ trợ thẻ video.
                </video>
                <div id="video-error-overlay" class="position-absolute top-0 start-0 w-100 h-100 d-flex flex-column align-items-center justify-content-center bg-dark text-white d-none" style="z-index: 10;">
                    <i class="fa-solid fa-circle-exclamation text-danger fs-1 mb-3"></i>
                    <p class="fs-6 fw-bold mb-1 text-center" id="video-error-title">Không thể tải video</p>
                    <p class="fs-8 text-muted text-center px-4" id="video-error-msg">Vui lòng chọn bài học khác hoặc kiểm tra lại kết nối.</p>
                </div>
            </div>

            <!-- Course Title & Actions -->
            <div class="p-4 border-bottom">
                <div class="d-flex justify-content-between align-items-start gap-3 mb-3 flex-wrap">
                    <h1 class="course-lesson-title fw-bold font-heading m-0 w-100" th:text="${courseDetal.tittle}">
                        Guitar điện cơ bản cùng Khoa (FPTU MUSIC)</h1>
                </div>
            </div>

            <!-- Course Nav Tabs -->
            <div class="border-bottom bg-light bg-opacity-25 px-4">
                <ul class="nav player-nav-tabs gap-4 m-0 p-0" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link px-0 py-3 active" id="tab-overview-btn" role="tab">Tổng Quan</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link px-0 py-3" id="tab-quiz-btn" role="tab">Câu Hỏi Ôn Tập</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link px-0 py-3" id="tab-document-btn" role="tab">Tài Liệu Bài Học</button>
                    </li>
                </ul>
            </div>

            <!-- Tabs Content Area -->
            <div class="p-4" id="player-tab-content">

                <!-- Tab Panel 1: Overview -->
                <div class="tab-panel-item" id="panel-overview">
                    <h3 class="tab-panel-subtitle fw-bold fs-6 mb-3 font-heading d-flex align-items-center gap-2 text-dark">
                        <i data-lucide="file-text" class="text-primary" style="width: 20px; height: 20px;"></i> Mô Tả
                        Khóa Học
                    </h3>
                    <div class="card border border-light-subtle rounded-3 p-4 bg-light bg-opacity-25"
                         style="border-radius: var(--radius-md) !important;">
                        <div class="text-muted fs-7 m-0 leading-relaxed" th:utext="${courseDetal.description}">
                        </div>
                    </div>
                </div>

                <!-- Tab Panel 2: Quiz -->
                <div class="tab-panel-item d-none" id="panel-quiz">
                    <h3 class="tab-panel-subtitle fw-bold fs-6 mb-3 font-heading d-flex align-items-center gap-2 text-dark">
                        <i data-lucide="help-circle" class="text-primary" style="width: 20px; height: 20px;"></i>Câu Hỏi
                        Ôn Tập
                    </h3>
                    <div class="quiz-iframe-shell border border-light-subtle rounded-3 overflow-hidden bg-white shadow-sm">
                        <iframe id="lesson-quiz-frame" class="quiz-iframe"
                                src=""
                                title="Trang câu hỏi ôn tập"
                                loading="lazy" referrerpolicy="no-referrer">
                        </iframe>
                    </div>
                </div>

                <!-- Tab Panel 3: Lesson Document -->
                <div class="tab-panel-item d-none" id="panel-document">
                    <div id="materials-container">
                        <!-- Dynamically populated by JS -->
                    </div>
                </div>

            </div>
        </main>

        <!-- Right Panel: Course Contents Sidebar -->
        <aside class="col-lg-4 col-12 border-start bg-white d-flex flex-column sidebar-curriculum-container">
            <!-- Sidebar Header -->
            <div class="p-4 pb-3 border-bottom">
                <h2 class="sidebar-title fw-bold font-heading fs-5 m-0 text-dark">Nội dung khóa học</h2>
            </div>

            <!-- Sidebar Content -->
            <div class="flex-grow-1 p-4 pb-0 overflow-y-auto" style="max-height: calc(100vh - 180px);">
                <!-- Sections List -->
                <div class="accordion border-0" id="accordionCurriculum">
                    <!-- Iterate sections -->
                    <div th:each="section, secStat : ${courseDetal.sections}"
                         class="accordion-item border-0 border-bottom">
                        <h3 class="accordion-header">
                            <button class="accordion-button bg-light text-dark fw-bold fs-7 p-3 d-flex justify-content-between align-items-center border-0 rounded-0"
                                    th:classappend="${secStat.index != 0} ? 'collapsed' : ''"
                                    type="button"
                                    data-bs-toggle="collapse"
                                    th:data-bs-target="${'#collapse-' + secStat.index}"
                                    th:aria-expanded="${secStat.index == 0}">
                                    <span class="text-start d-inline-flex flex-column">
                                        <span class="d-block mb-1"
                                              th:text="${section.position + '. ' + section.title}">Section Title</span>
                                        <span class="text-muted fs-8 fw-semibold font-body"
                                              th:text="${section.lessons != null ? section.lessons.size() + ' bài học' : '0 bài học'}">0
                                            bài học</span>
                                    </span>
                            </button>
                        </h3>

                        <div th:id="${'collapse-' + secStat.index}" class="accordion-collapse collapse"
                             th:classappend="${secStat.index == 0} ? 'show' : ''"
                             th:attr="data-bs-parent='#accordionCurriculum'">
                            <div class="accordion-body p-0">
                                <div class="list-group list-group-flush">
                                    <!-- Iterate lessons inside section -->
                                    <div th:each="secLesson, lStat : ${section.lessons}"
                                         th:data-sidebar-lesson-id="${secLesson.Id}"
                                         th:data-lesson-title="${secLesson.title}"
                                         class="list-group-item list-group-item-action d-flex align-items-start gap-3 p-3 border-0 lesson-item"
                                         th:classappend="${lStat.index == 0} ? ' active-lesson-item' : ''">
                                        <!-- Lesson Icon Indicator -->
                                        <div class="lesson-icon-indicator rounded-circle border d-flex align-items-center justify-content-center flex-shrink-0 mt-0.5 text-muted"
                                             style="width: 18px; height: 18px; border-color: #cbd5e1 !important;">
                                            <i data-lucide="play"
                                               style="width: 10px; height: 10px; margin-left: 1px;"></i>
                                        </div>

                                        <div class="flex-grow-1">
                                            <a href="#"
                                               class="fs-7 text-muted-dark d-block fw-semibold leading-snug text-decoration-none lesson-link"
                                               th:data-lesson-id="${secLesson.Id}"
                                               th:text="${secLesson.title}">Lesson title</a>
                                            <span class="d-flex align-items-center gap-1 text-muted fs-8 mt-1"><i
                                                    data-lucide="clock" style="width:12px;"></i> <span
                                                    th:text="${secLesson.dutationSecond != null ? T(java.lang.String).format('%d:%02d', secLesson.dutationSecond / 60, secLesson.dutationSecond % 60) : '—'}">—</span></span>
                                        </div>

                                        <!-- Hidden materials info for client-side display -->
                                        <div class="hidden-lesson-materials d-none">
                                            <div th:each="material : ${secLesson.materials}"
                                                 th:data-material-id="${material.Id}"
                                                 th:data-material-name="${material.file_name}">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

    </div>
</div>

<!-- Bootstrap 5 Bundle JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

<!-- Custom JavaScript for Course Preview -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        // Initialize Lucide icons if available
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }

        // Tab Switching
        const tabs = {
            'tab-overview-btn': 'panel-overview',
            'tab-quiz-btn': 'panel-quiz',
            'tab-document-btn': 'panel-document'
        };

        const tabBtns = document.querySelectorAll(".player-nav-tabs .nav-link");
        const panels = document.querySelectorAll(".tab-panel-item");

        tabBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                const targetPanelId = tabs[btn.id];
                if (!targetPanelId) return;

                tabBtns.forEach(b => b.classList.remove("active"));
                panels.forEach(p => p.classList.add("d-none"));

                btn.classList.add("active");
                document.getElementById(targetPanelId).classList.remove("d-none");
            });
        });

        // Lesson selector elements
        const lessonItems = document.querySelectorAll(".lesson-item");
        const videoPlayer = document.getElementById("lesson-video");
        const lessonTitleHeader = document.querySelector(".course-lesson-title");
        const quizIframe = document.getElementById("lesson-quiz-frame");
        const materialsContainer = document.getElementById("materials-container");
        const errorOverlay = document.getElementById("video-error-overlay");
        const errorTitle = document.getElementById("video-error-title");
        const errorMsg = document.getElementById("video-error-msg");

        function showVideoError(title, message) {
            console.error("Video Error Details:", { title, message });
            if (errorOverlay && errorTitle && errorMsg) {
                errorTitle.textContent = title;
                errorMsg.textContent = message;
                errorOverlay.classList.remove("d-none");
            }
        }

        function hideVideoError() {
            if (errorOverlay) {
                errorOverlay.classList.add("d-none");
            }
        }

        // Monitor video playback and loading errors
        if (videoPlayer) {
            videoPlayer.addEventListener("error", (e) => {
                const error = videoPlayer.error;
                let message = "Đã xảy ra lỗi không xác định khi tải video.";
                if (error) {
                    switch (error.code) {
                        case error.MEDIA_ERR_ABORTED:
                            message = "Trình phát bị hủy bỏ bởi người dùng.";
                            break;
                        case error.MEDIA_ERR_NETWORK:
                            message = "Lỗi mạng xảy ra khi đang tải video.";
                            break;
                        case error.MEDIA_ERR_DECODE:
                            message = "Video bị lỗi hoặc định dạng không được hỗ trợ bởi trình duyệt này.";
                            break;
                        case error.MEDIA_ERR_SRC_NOT_SUPPORTED:
                            message = "Đường dẫn video không hợp lệ hoặc định dạng không được hỗ trợ.";
                            break;
                    }
                }
                showVideoError("Lỗi phát video", message + " (Đường dẫn: " + videoPlayer.src + ")");
            });
        }

        function selectLesson(lessonItem, shouldPlay = false) {
            // Remove active classes
            lessonItems.forEach(item => item.classList.remove("active-lesson-item"));
            lessonItem.classList.add("active-lesson-item");

            const lessonId = lessonItem.getAttribute("data-sidebar-lesson-id");
            const lessonTitle = lessonItem.getAttribute("data-lesson-title");

            console.log("Selected lesson:", { lessonId, lessonTitle });

            // 1. Update Title below the video
            if (lessonTitleHeader) {
                lessonTitleHeader.textContent = lessonTitle;
            }

            // 2. Load Video URL dynamically
            if (videoPlayer && lessonId) {
                hideVideoError();
                console.log("Fetching video url for lessonId:", lessonId);
                fetch("/lesson/" + lessonId)
                    .then(response => {
                        console.log("Fetch response for lesson " + lessonId + ":", response);
                        if (!response.ok) {
                            throw new Error("Không thể tải thông tin bài học từ server (HTTP " + response.status + ")");
                        }
                        return response.text();
                    })
                    .then(url => {
                        console.log("Resolved video URL:", url);
                        if (!url || url.trim() === "") {
                            showVideoError("Không có video", "Bài học này chưa được cấu hình đường dẫn video.");
                            return;
                        }
                        // Clear the poster so it doesn't show the course thumbnail instead of the video
                        videoPlayer.removeAttribute("poster");
                        videoPlayer.src = url;
                        videoPlayer.load();
                        if (shouldPlay) {
                            videoPlayer.play()
                                .then(() => console.log("Video playing successfully."))
                                .catch(e => {
                                    console.warn("Autoplay blocked or play interrupted:", e);
                                });
                        }
                    })
                    .catch(err => {
                        console.error("Error fetching lesson video URL:", err);
                        showVideoError("Lỗi tải video", err.message || "Không thể kết nối đến server để lấy URL video.");
                    });
            } else {
                showVideoError("Thiếu thông tin", "Không tìm thấy thông tin bài học hoặc trình phát video.");
            }

            // 3. Load Quiz iframe source
            if (quizIframe && lessonId) {
                quizIframe.src = "/quiz/lesson/" + lessonId;
            }

            // 4. Load Materials dynamically
            if (materialsContainer) {
                materialsContainer.innerHTML = "";
                const materialsDivs = lessonItem.querySelectorAll(".hidden-lesson-materials div");

                if (materialsDivs.length === 0) {
                    materialsContainer.innerHTML = `
                        <div class="lesson-document-stats lesson-document-stats-empty mb-3">
                            <div class="lesson-document-stat lesson-document-stat-empty">
                                Chưa có tài liệu nào được gắn với bài học này.
                            </div>
                        </div>
                    `;
                } else {
                    materialsDivs.forEach(div => {
                        const mId = div.getAttribute("data-material-id");
                        const mName = div.getAttribute("data-material-name");
                        const mExt = mName ? mName.split('.').pop().toUpperCase() : 'FILE';

                        const materialHtml = `
                            <div class="lesson-document-viewer mb-4" data-material-id="${mId}">
                                <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 mb-4">
                                    <div>
                                        <h3 class="tab-panel-subtitle fw-bold fs-6 mb-2 font-heading d-flex align-items-center gap-2 text-dark">
                                            <i data-lucide="file-text" class="text-primary" style="width: 20px; height: 20px;"></i> Tài Liệu Bài Học
                                        </h3>
                                        <p class="text-muted fs-7 m-0">
                                            Xem trực tiếp tài liệu "${mName}" bằng Office Viewer hoặc tải file gốc về máy.
                                        </p>
                                    </div>
                                    <div class="d-flex flex-wrap align-items-center gap-2">
                                        <a class="btn btn-outline-primary rounded-3 px-3 py-2 fw-semibold fs-7 d-inline-flex align-items-center gap-2 btn-open-lesson-document"
                                           href="#" target="_blank" rel="noopener">
                                            <i data-lucide="external-link" style="width: 16px; height: 16px;"></i>
                                            <span>Mở tab mới</span>
                                        </a>
                                        <a class="btn btn-primary rounded-3 px-3 py-2 fw-semibold fs-7 d-inline-flex align-items-center gap-2 shadow-primary btn-download-lesson-document"
                                           href="/material/${mId}/download">
                                            <i data-lucide="download" style="width: 16px; height: 16px;"></i>
                                            <span>Tải tài liệu</span>
                                        </a>
                                    </div>
                                </div>

                                <div class="lesson-document-meta d-flex flex-wrap align-items-center gap-2 mb-3">
                                    <span class="badge rounded-pill bg-primary-subtle text-primary fw-semibold px-3 py-2">${mExt}</span>
                                    <span class="text-muted fs-8">${mName}</span>
                                </div>

                                <div class="lesson-document-frame-shell border rounded-3 overflow-hidden bg-light">
                                    <iframe class="lesson-document-frame" title="Tài liệu bài học" loading="lazy" allowfullscreen></iframe>
                                </div>
                            </div>
                        `;

                        const tempDiv = document.createElement("div");
                        tempDiv.innerHTML = materialHtml;
                        const viewerEl = tempDiv.firstElementChild;
                        materialsContainer.appendChild(viewerEl);

                        const docFrame = viewerEl.querySelector(".lesson-document-frame");
                        const openLink = viewerEl.querySelector(".btn-open-lesson-document");

                        // fetch("/material/" + mId)
                        //     .then(res => res.text())
                        //     .then(url => {
                        //         if (openLink) openLink.href = url;
                        //         if (docFrame) docFrame.src = url;
                        //     })
                        //     .catch(err => {
                        //         console.error("Error fetching material URL:", err);
                        //         if (openLink) openLink.classList.add('disabled');
                        //     });
                        fetch("/material/" + mId)
                            .then(res => {
                                if (!res.ok) {
                                    throw new Error("Không thể tải tài liệu (HTTP " + res.status + ")");
                                }
                                return res.text();
                            })
                            .then(url => {
                                if (!url || url.trim() === "" || url.trim() === "null") {
                                    throw new Error("Không tìm thấy đường dẫn tài liệu.");
                                }
                                if (openLink) openLink.href = url;
                                // Instructor viewCourse material fix: backend đã trả URL xem được (PDF SAS hoặc Office Viewer),
                                // nên iframe dùng trực tiếp URL này, không bọc Office Viewer thêm lần nữa.
                                if (docFrame) docFrame.src = url;
                            })
                            .catch(err => {
                                console.error("Error fetching material URL:", err);
                                if (docFrame) {
                                    docFrame.removeAttribute("src");
                                    docFrame.closest(".lesson-document-frame-shell").innerHTML =
                                        `<div class="p-4 text-center text-muted">${err.message || "Không thể hiển thị tài liệu."}</div>`;
                                }
                                if (openLink) openLink.classList.add('disabled');
                            });
                    });

                    if (typeof lucide !== 'undefined') {
                        lucide.createIcons();
                    }
                }
            }
        }

        // Add click events to the entire lesson item container
        lessonItems.forEach(item => {
            item.style.cursor = "pointer";
            item.addEventListener("click", (e) => {
                // Prevent default anchor click behavior
                const link = item.querySelector(".lesson-link");
                if (link && e.target.closest(".lesson-link")) {
                    e.preventDefault();
                }
                selectLesson(item, true); // true means play video on manual user click
            });
        });

        // Auto select first lesson
        if (lessonItems.length > 0) {
            selectLesson(lessonItems[0], false); // false means just load, don't autoplay initially (browser restriction)
        }
    });
</script>
