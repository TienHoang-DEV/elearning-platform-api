<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo-background.png}">
    <title>Quản lý Manager</title>
    <th:block layout:fragment="page-css">
        <link rel="stylesheet" th:href="@{/css/manager/instructor.css}">
    </th:block>
</head>
<body>
    <div layout:fragment="content">
        <form th:action="@{/admin/manager/list}" method="get" class="page-header page-header-top">
            <div>
                <h1>Quản lý Manager</h1>
                <p>Danh sách và trạng thái hoạt động của các tài khoản Manager</p>
            </div>
            <div class="header-actions">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm manager..."
                    class="search-input form-control">
                <select name="status" class="search-input search-select form-select" onchange="this.form.submit()">
                    <option value="" th:selected="${status == null}">Tất cả trạng thái</option>
                    <option value="ACTIVE" th:selected="${status != null and status.name() == 'ACTIVE'}">Hoạt động</option>
                    <option value="BANNED" th:selected="${status != null and status.name() == 'BANNED'}">Bị khóa</option>
                </select>
                <button type="submit" class="d-none">Tìm kiếm</button>
            </div>
        </form>
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Tên</th>
                        <th>Email</th>
                        <th>Điện thoại</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="request : ${requestPage.content}">
                        <td>
                            <div class="user-info">
                                <div class="avatar-sm me-2">
                                    <img th:if="${request.avatarUrl != null}" th:src="${request.avatarUrl}" alt="Avatar" class="w-100 h-100 object-fit-cover" />
                                    <span th:if="${request.avatarUrl == null}" th:text="${request.firstName != null and !request.firstName.isEmpty() ? #strings.substring(request.firstName, 0, 1).toUpperCase() : 'M'}">M</span>
                                </div>
                                <span class="user-name" th:text="${request.fullName}">Nguyễn Văn A</span>
                            </div>
                        </td>
                        <td th:text="${request.email}">manager@example.com</td>
                        <td th:text="${request.phone != null ? request.phone : 'N/A'}">0123456789</td>
                        <td>
                            <span
                                th:class="${'badge badge-' + (request.status.name() == 'ACTIVE' ? 'success' : 'danger')}"
                                th:text="${request.status.name() == 'ACTIVE' ? 'Hoạt động' : 'Bị khóa'}">
                                Hoạt động
                            </span>
                        </td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/admin/manager/detail/{id}(id=${request.id})}"
                                    class="action-btn"><i class="ph ph-eye"></i> Xem Chi Tiết</a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${requestPage.isEmpty()}">
                        <td colspan="5" class="text-center py-4">Không tìm thấy manager nào.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- ══════════ PAGINATION ══════════ -->
        <div class="pagination-circle-container" th:if="${requestPage.totalPages > 1}">
            <div class="pagination-circle-buttons">
                <!-- Previous -->
                <a th:if="${requestPage.hasPrevious()}"
                    th:href="@{/admin/manager/list(keyword=${keyword}, status=${status}, page=${requestPage.number - 1}, size=${requestPage.size})}"
                    class="page-circle-btn">
                    <i class="ph ph-caret-left"></i>
                </a>
                <span th:unless="${requestPage.hasPrevious()}" class="page-circle-btn disabled">
                    <i class="ph ph-caret-left"></i>
                </span>

                <!-- Pages list -->
                <a th:each="i : ${#numbers.sequence(startPage, endPage)}"
                    th:href="@{/admin/manager/list(keyword=${keyword}, status=${status}, page=${i}, size=${requestPage.size})}"
                    th:class="${requestPage.number == i ? 'page-circle-btn active' : 'page-circle-btn'}"
                    th:text="${i + 1}">1</a>

                <!-- Next -->
                <a th:if="${requestPage.hasNext()}"
                    th:href="@{/admin/manager/list(keyword=${keyword}, status=${status}, page=${requestPage.number + 1}, size=${requestPage.size})}"
                    class="page-circle-btn">
                    <i class="ph ph-caret-right"></i>
                </a>
                <span th:unless="${requestPage.hasNext()}" class="page-circle-btn disabled">
                    <i class="ph ph-caret-right"></i>
                </span>
            </div>
        </div>
    </div>
</body>
</html>
