services:

  app:
    build: .
    container_name: elearning-app

    depends_on:
      init-db:
        condition: service_completed_successfully

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      LOCAL_SQL_SERVER_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=ElearningPlatform;encrypt=true;trustServerCertificate=true"
      LOCAL_SQL_SERVER_USERNAME: "sa"
      LOCAL_SQL_SERVER_PASSWORD: "${MSSQL_SA_PASSWORD}"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: elearning-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  init-db:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: elearning-init-db

    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

    depends_on:
      sqlserver:
        condition: service_healthy

    volumes:
      - ./sql_ddl_dml/init-db.sql:/init-db.sql:ro

    command:
      - /bin/bash
      - -c
      - |
        /opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver \
          -U sa \
          -P "$$MSSQL_SA_PASSWORD" \
          -C \
          -i /init-db.sql


volumes:
  sqlserver-data: