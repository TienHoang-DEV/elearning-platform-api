<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Manager - Quản lý Giảng viên</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../../../static/css/manager/instructor.css" th:href="@{/css/manager/instructor.css}">
</head>

<body>
    <div class="app-container">
        <aside th:replace="~{manager/fragments/sidebar :: sidebar(activePage='instructor')}"></aside>

        <div class="main-wrapper">
            <main class="content">
                <form th:action="@{/manager/instructor/list}" method="get" class="page-header page-header-top">
                    <div>
                        <h1>Quản lý Giảng viên</h1>
                        <p>Quản lý danh sách tài khoản giảng viên</p>
                    </div>
                    <div class="header-actions">
                        <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm giảng viên..."
                            class="search-input form-control">
                        <select name="status" class="search-input search-select form-select" onchange="this.form.submit()">
                            <option value="" th:selected="${status == null or status == ''}">Tất cả trạng thái</option>
                            <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Hoạt động</option>
                            <option value="BANNED" th:selected="${status == 'BANNED'}">Bị khóa</option>
                        </select>
                        <button type="submit" class="d-none">Search</button>
                    </div>
                </form>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Tên</th>
                                <th>Email</th>
                                <th>Điện thoại</th>
                                <th>Trạng thái</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="request : ${requestPage.content}">
                                <td>
                                    <div class="user-info">
                                        <span class="user-name" th:text="${request.fullName}">Nguyễn Văn A</span>
                                    </div>
                                </td>
                                <td th:text="${request.email}">nguyenvana@example.com</td>
                                <td th:text="${request.phone != null ? request.phone : 'N/A'}">0123456789</td>
                                <td>
                                    <span
                                        th:class="${'badge badge-' + (request.status?.name() == T(vn.edu.fpt.enums.UserStatus).ACTIVE.name() ? 'success' : 'danger')}"
                                        th:text="${request.status?.name() == T(vn.edu.fpt.enums.UserStatus).ACTIVE.name() ? 'Hoạt động' : 'Bị khóa'}">
                                        Hoạt động
                                    </span>
                                </td>
                                <td>
                                    <div class="actions">
                                        <a th:href="@{/manager/instructor/detail/{id}(id=${request.id})}"
                                            class="action-btn"><i class="ph ph-eye"></i> Xem Chi Tiết</a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${requestPage.empty}">
                                <td colspan="5" class="text-center py-4">Không tìm thấy giảng viên nào.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- ══════════ PAGINATION ══════════ -->
                <div class="pagination-circle-container" th:if="${requestPage.totalPages > 1}">
                    <div class="pagination-circle-buttons">
                        <!-- Previous -->
                        <a th:if="${requestPage.hasPrevious()}"
                            th:href="@{/manager/instructor/list(keyword=${keyword}, status=${status}, page=${requestPage.number - 1}, size=${requestPage.size})}"
                            class="page-circle-btn">
                            <i class="ph ph-caret-left"></i>
                        </a>
                        <span th:unless="${requestPage.hasPrevious()}" class="page-circle-btn disabled">
                            <i class="ph ph-caret-left"></i>
                        </span>

                        <!-- Danh sách số trang -->
                        <a th:each="i : ${#numbers.sequence(0, requestPage.totalPages - 1)}"
                            th:href="@{/manager/instructor/list(keyword=${keyword}, status=${status}, page=${i}, size=${requestPage.size})}"
                            th:class="${requestPage.number == i ? 'page-circle-btn active' : 'page-circle-btn'}"
                            th:text="${i + 1}">1</a>

                        <!-- Nút Next -->
                        <a th:if="${requestPage.hasNext()}"
                            th:href="@{/manager/instructor/list(keyword=${keyword}, status=${status}, page=${requestPage.number + 1}, size=${requestPage.size})}"
                            class="page-circle-btn">
                            <i class="ph ph-caret-right"></i>
                        </a>
                        <span th:unless="${requestPage.hasNext()}" class="page-circle-btn disabled">
                            <i class="ph ph-caret-right"></i>
                        </span>
                    </div>
                </div>

            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
