<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gửi Hồ Sơ Thành Công - Learning Hub</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/home.css}">
  <link rel="stylesheet" th:href="@{/css/request-success.css}">

  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<header class="site-header" id="site-header">
  <div class="container d-flex align-items-center justify-content-between">
    <a class="header-logo d-flex align-items-center gap-2 text-decoration-none" th:href="@{/}">
      <i class="fa-solid fa-layer-group logo-fa-layers"></i>
      <span class="logo-text fw-bold font-heading">LearningHub</span>
    </a>

    <div class="header-auth d-flex align-items-center gap-3">
      <div class="dropdown user-profile-dropdown" th:if="${currentUser != null}">
        <button class="btn d-flex align-items-center gap-2 p-1 border-0 bg-transparent dropdown-toggle no-caret" type="button" data-bs-toggle="dropdown">
          <div class="user-avatar-wrapper position-relative">
            <img th:src="${currentUser.avatarUrl != null ? currentUser.avatarUrl : '/images/avatar.png'}" alt="User Avatar" class="rounded-circle header-user-avatar">
            <span class="user-online-badge"></span>
          </div>
          <span class="user-name fw-semibold fs-7 text-dark d-none d-md-inline-block" th:text="${currentUser.firstName + ' ' + currentUser.lastName}">Nguyễn Văn A</span>
        </button>
      </div>
    </div>
  </div>
</header>

<main class="success-main-wrapper">
  <div class="container py-5 d-flex justify-content-center align-items-center">
    <div class="glass-card success-card p-5 text-center position-relative overflow-hidden">
      <div class="success-decor-circle decor-1"></div>
      <div class="success-decor-circle decor-2"></div>

      <div class="position-relative style-z-index py-3">
        <div class="success-icon-wrapper mx-auto mb-4 scale-up-animation">
          <div class="success-icon-pulse"></div>
          <i data-lucide="check-circle-2" class="text-success" style="width: 48px; height: 48px;"></i>
        </div>

        <h1 class="font-heading fw-bold text-dark mb-3 success-title">Gửi Hồ Sơ Thành Công!</h1>
        <p class="text-muted fs-7 max-w-450 mx-auto lh-lg mb-5">
          Hồ sơ đăng ký giảng viên của bạn đã được hệ thống tiếp nhận và chuyển đến ban nhân sự xét duyệt.
        </p>

        <div class="d-flex justify-content-center">
          <a th:href="@{/home}" class="btn btn-primary-solid rounded-pill px-5 py-3 fw-bold fs-6 d-flex align-items-center justify-content-center gap-2 shadow-blue btn-back-home">
            <i data-lucide="home" style="width:18px; height:18px;"></i>
            <span>Quay Về Trang Chủ</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3 border-top pt-4">
      <p class="text-muted fs-7 m-0">© 2026 Learning Hub. All rights reserved.</p>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  lucide.createIcons();
</script>
</body>
</html>
